schema_version: 1
section: V
groups:
- id: V1
  kind: choice
  title: 問題１
  instruction: __　　　__の言葉の読み方として最もよいものを、１・２・３・４から一つ選びなさい。
  items:
  - id: V-q01
    source_number: 1
    prompt: これから__概略__をご説明します。
    options:
    - がいかく
    - きかく
    - がいりゃく
    - きりゃく
  - id: V-q02
    source_number: 2
    prompt: 面接には、しっかりと準備をして__臨みたい__と思う。
    options:
    - あからみたい
    - いどみたい
    - はげみたい
    - のぞみたい
  - id: V-q03
    source_number: 3
    prompt: 昨日、__督促__の電話がかかってきた。
    options:
    - さいそく
    - とくそく
    - さいぞく
    - とくぞく
  - id: V-q04
    source_number: 4
    prompt: 春になり、辺りには花の香りが__漂い__はじめた。
    options:
    - さまよい
    - うるおい
    - ただよい
    - におい
  - id: V-q05
    source_number: 5
    prompt: 応募作品を__厳正__に審査した。
    options:
    - げんせい
    - げんしょう
    - がんせい
    - がんしょう
  - id: V-q06
    source_number: 6
    prompt: これ以上__拒んで__もしかたない。
    options:
    - うらんで
    - おがんで
    - にくんで
    - こばんで
- id: V2
  kind: choice
  title: 問題２
  instruction: （　　　）に入れるのに最もよいものを、１・２・３・４から一つ選びなさい。
  items:
  - id: V-q07
    source_number: 7
    prompt: 議会に提出された条例は、賛成多数で（　　　）された。
    options:
    - 判別
    - 採取
    - 選出
    - 可決
  - id: V-q08
    source_number: 8
    prompt: この国に来たころは、言葉も通じず知人もいなくて、とても（　　　）気持ちになったものだ。
    options:
    - かすかな
    - 心細い
    - ひそかな
    - 心無い
  - id: V-q09
    source_number: 9
    prompt: Ａ社は銀行からの支援によって経営の悪化を何とか（　　　）ことができた。
    options:
    - 投げ出す
    - 吸い上げる
    - 打ち切る
    - 食い止める
  - id: V-q10
    source_number: 10
    prompt: この会社の営業部では、社員一人一人に毎週厳しい（　　　）が課されている。
    options:
    - キャリア
    - ノルマ
    - チーフ
    - コスト
  - id: V-q11
    source_number: 11
    prompt: 今日の対談は、サッカー選手と物理学者という（　　　）の組み合わせで行われる。
    options:
    - 異色
    - 大差
    - 変形
    - 遠隔
  - id: V-q12
    source_number: 12
    prompt: この美しい映像は、コンピュータの最新技術を（　　　）して作られたものだ。
    options:
    - 駆使
    - 引用
    - 充当
    - 摂取
  - id: V-q13
    source_number: 13
    prompt: この数年で数々の食品問題が発覚し、食の安全に対する信頼が（　　　）はじめた。
    options:
    - 震え
    - 浮かれ
    - 揺らぎ
    - 乱れ
- id: V3
  kind: choice
  title: 問題３
  instruction: __　　　__の言葉に意味が最も近いものを、１・２・３・４から一つ選びなさい。
  items:
  - id: V-q14
    source_number: 14
    prompt: そのことが一番__気掛かり__でした。
    options:
    - 残念
    - 意外
    - 心配
    - 不満
  - id: V-q15
    source_number: 15
    prompt: __案の定__、川西さんは来なかった。
    options:
    - なぜか
    - やはり
    - あいにく
    - たしか
  - id: V-q16
    source_number: 16
    prompt: 公の場で__不用意な__発言はしないでほしい。
    options:
    - 無駄な
    - 不利な
    - 無意味な
    - 不注意な
  - id: V-q17
    source_number: 17
    prompt: これはかなり__厄介な__問題だ。
    options:
    - 面倒な
    - 深刻な
    - 重要な
    - 特殊な
  - id: V-q18
    source_number: 18
    prompt: 山田氏は当時のことを__回想して__次のように語った。
    options:
    - 反省して
    - 考え直して
    - 後悔して
    - 思い返して
  - id: V-q19
    source_number: 19
    prompt: これは__手分け__したほうがいい。
    options:
    - 分配
    - 分担
    - 分解
    - 分別
- id: V4
  kind: choice
  title: 問題４
  instruction: 次の言葉の使い方として最もよいものを、１・２・３・４から一つ選びなさい。
  items:
  - id: V-q20
    source_number: 20
    prompt: 抱え込む
    options:
    - 何度も繰り返して覚えることで、記憶をしっかり__抱え込む__ことができる。
    - 問題が生じたら、一人で__抱え込まず__、上司や同僚に相談するといい。
    - この塾は、今年度から生徒を３０人まで__抱え込む__ことができるようになった。
    - 母は私が子どものころに描いた絵を、今まで大事に__抱え込んで__くれていた。
  - id: V-q21
    source_number: 21
    prompt: 裏腹
    options:
    - あの双子は外見はそっくりだが、全く__裏腹__の性格をしている。
    - 地図を見ると、商店街と住宅街は駅から__裏腹__の方角にあるようだ。
    - 前向きな言葉とは__裏腹__に課長の態度は消極的で、計画は一向に進まない。
    - みんなが私を見るので変だと思ったら、セーターを__裏腹__に着ていた。
  - id: V-q22
    source_number: 22
    prompt: 耐えがたい
    options:
    - 今年の夏は例年になく気温が上がり、毎日__耐えがたい__暑さが続いている。
    - このお菓子は湿気に__耐えがたい__ので、開封したら早めに食べたほうがいい。
    - そんなぜいたくな暮らしをしていたら、すぐに貯金が__耐えがたく__なるだろう。
    - この自転車は何度も修理して使っていたが、もう__耐えがたい__ようだ。
  - id: V-q23
    source_number: 23
    prompt: 携わる
    options:
    - 来年、高校を受験するので、現在受験勉強に__携わっています__。
    - 私は企業で薬品の開発に__携わっており__、日々研究に追われている。
    - 仕事を辞めて自由な時間ができたので、新しい趣味に__携わり__はじめた。
    - 今日は午前中は来客と面会し、午後は２時間企画会議に__携わる__予定だ。
  - id: V-q24
    source_number: 24
    prompt: 人一倍
    options:
    - 村田さんが自分の会社を持てたのは、これまで__人一倍__努力してきたからだ。
    - あの人は大切なお客様なので、__人一倍__上等なワインでもてなしたい。
    - 弟は子どものころから体が大きくて、身長はいつもクラスで__人一倍__だった。
    - タレントの中村さんの司会が好評で、この番組の視聴率は__人一倍__だ。
  - id: V-q25
    source_number: 25
    prompt: 復旧
    options:
    - 長く待たされたが、雨で中断された野球の試合がもうすぐ__復旧__するらしい。
    - あの二人はけんかしても必ず__復旧__するので、本当は仲がいいのだろう。
    - 今年の冬はひどい風邪をひいてしまい、仕事になかなか__復旧__できなかった。
    - 昨夜から停電が続いていたが、先ほど１２時間振りにようやく__復旧__した。
