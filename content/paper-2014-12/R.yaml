- id: R11
  kind: reading
  title: 問題１１
  instruction: 次のＡとＢの文章を読んで、後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。
  items:
  - id: R11-heritage
    stimulus:
    - type: heading
      text: Ａ
    - type: box
      blocks:
      - type: paragraph
        text: 世界遺産への関心が高まるのは喜ばしい。各地で登録をめざす動きも活発化している。新聞をはじめとしたメディアがそれらを報じる機会も増えた。ただ、いつも気になるのは、そこに「地元では観光振興に結びつくのを期待している」といったたぐいの文言が、必ずと言ってよいほど目につくことだ。
      - type: paragraph
        text: 私としては、観光・経済効果の拡大を否定はしないし、文化財保護との両立はできると考えている。しかし、近年の状況を眺めると、遺産の保護という基本理念が、あまりにも置き去りにされてしまってはいないだろうか。
      - type: paragraph
        text: （中村俊介『世界遺産が消えてゆく』による）
        style: small
        align: right
    - type: separator
    - type: heading
      text: Ｂ
    - type: box
      blocks:
      - type: paragraph
        text: 日本では映像や書籍など、さまざまなメディアで世界遺産を商品化し、パッケージ・ツアーが数多く組まれ、観光産業と深く結び付く。だが、それは本当に建築や自然を愛し、歴史への理解を深める人間を増やしているのだろうか。
      - type: paragraph
        text: （中略）
      - type: paragraph
        text: 世界遺産であろうとなかろうと、建築の価値は個別に判断すればいい。人間も肩書きだけで、すべてを理解できないだろう。世界遺産に認定されたからといって、株のように、建築の価値が上昇するわけではない。むろん、観光資源として巨額の富をもたらすだろうが、モノとしては同じままである。私が気になるのは、世界遺産だけを特別視するあまり、逆にそれ以外のものはがんばって保存しなくてもいいという風潮を助長するのではないかということだ。
      - type: paragraph
        text: （五十嵐太郎『建築はいかに社会と回路をつなぐのか』による）
        style: small
        align: right
    questions:
    - id: R-q63
      source_number: 63
      prompt: 近年の世界遺産について、ＡとＢが共通して認識している点は何か。
      options:
      - 世界遺産の報道のしかたが過剰になってきている。
      - 世界遺産への登録をめざす動きが過熱している。
      - 世界遺産への登録で登録以前より価値が上がる。
      - 世界遺産は観光振興と密接に関係している。
    - id: R-q64
      source_number: 64
      prompt: ＡとＢは、世界遺産をめぐってどのような姿勢を持つべきだと述べているか。
      options:
      - ＡもＢも、世界遺産への登録による経済効果は期待すべきではないと述べている。
      - ＡもＢも、認定にかかわらず文化財として価値のあるものは保護すべきだと述べている。
      - Ａは保護という本来の目的に立ち戻るべきだと述べ、Ｂは認定に惑わされずもの自体の価値を見定めるべきだと述べている。
      - Ａは世界遺産に値するか冷静に再検討すべきだと述べ、Ｂは世界遺産だけを特別視せず他にも目を向けるべきだと述べている。
    source_pages:
    - 9
- id: R12
  kind: reading
  title: 問題１２
  instruction: 次の文章を読んで、後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。
  items:
  - id: R12-books
    stimulus:
    - type: paragraph
      text: 本というのは、人間と同じようなものだ。一律の価値によって優劣を決めることはできない。人気者がいるのと同じように、ベストセラーがある。嫌われ者がいるように、誰からも手に取られない本もある。だが、どれもがそれぞれの価値を持っている。それを求めている人の手に求めているときに渡れば、それは良書になる。
    - type: paragraph
      text: それゆえ、私はインターネットの書評サイトなどで、まるで自分を神であるかのように本の優劣を断定しているものには激しい抵抗を感じる。もちろん、書評をするのは悪いことではない。本を批判したりほめたりするのも、もちろん大事なことだ。だが、あくまでもそれは、その人の知識と関心と人柄によっての判断でしかない。つい神の立場でものを言いたくなる気持ちはわからないでもないが、それはあまりに傲慢というものだろう。
    - type: paragraph
      text: 私の本も、インターネットの書評サイトでかなり叩かれているものがある。それはそれでやむをえないと思っている。ある程度売れると、それをけなしたがる人間がいるものだ。本をけなすと、自分が著者よりも偉くなったような気がするのだろう。私自身も本を書くようになる前、いや、正直に言うとある程度売れる本を出すようになる前、他人の本をずいぶんけなしたものだ。
    - type: paragraph
      text: ただきわめて心外なのは、ないものねだりをしている評があまりに多いことだ。たとえば、私は__ある参考書__を出している。その趣旨としていることは、「大学の小論文試験に何とか合格できるだけのレベルの小論文が書けるようにするため、最低限これだけの知識は持っていてほしい」という知識を整理した参考書だ。だから、私はその本の中では、敢えて難しいことは書いていない。ところが、その参考書を酷評する（注）書評がある。そして、その評の中には「この本を読んでも、かろうじて合格するくらいの力しかつかない」と書かれている。
    - type: paragraph
      text: 私は、まさしくかろうじて合格するくらいの力をつけるためにその本を書いているのだ。かろうじて合格すれば、その本は最高の良書だろう。私がそのような意味で敢えてカットしたことを取り上げて、それが書かれていないからと批判されても、こちらとしては困ってしまう。
    - type: paragraph
      text: そのような身勝手な書評がなんと多いことか。知識のある人間が入門書を幼稚すぎるとけなし、知識のない人間が専門書をわかりにくいとけなす。しかし、それは単に自分の背丈にあっていない本を求めただけのことに過ぎない。きちんと自分の背丈にあった本を探して買うのが、読者の務めだと、私は思う。
    - type: paragraph
      text: 本について語るからには、あらゆる本に愛情を持つべきだと私は考えている。そうしてこそ、本を批判する資格を持つと思うのだ。
    - type: paragraph
      text: （樋口祐一『差がつく読書』による）
      style: small
      align: right
    - type: paragraph
      text: （注）酷評する：ひどく厳しい評価を下す
      style: small
    questions:
    - id: R-q65
      source_number: 65
      prompt: 筆者は、どのような書評が傲慢だと感じているか。
      options:
      - 大した理由づけもなく優劣を断定したもの
      - 優れている点を決して認めようとしないもの
      - 自身に知識があるかのように見せかけたもの
      - 自身の判断がすべてであるかのように評価したもの
    - id: R-q66
      source_number: 66
      prompt: __ある参考書__について、筆者が心外だと感じたのはどのような書評か。
      options:
      - どうにか合格できる程度を目指したのに、それ以上の内容が必要だと批判したもの
      - 合格に必要な最低限の知識を整理したものなのに、合格は不可能だと批判したもの
      - 敢えて難しいことは書いていないのに、それでもわかりにくいと批判したもの
      - 難しい試験でも合格できるように書いたのに、それでも不十分だと批判したもの
    - id: R-q67
      source_number: 67
      prompt: 筆者によると、本が良書と言えるのはどのような場合か。
      options:
      - 書評で強く批判されない場合
      - 多くの人が価値を認めている場合
      - 求める人に本の趣旨が理解しやすい場合
      - 求める人のレベルや目的にあっている場合
    - id: R-q68
      source_number: 68
      prompt: 本を批評する人に対して、筆者が言いたいことは何か。
      options:
      - 著者のあらゆる本を読むべきだ。
      - 極端に否定的な評価は避けるべきだ。
      - それぞれの本の存在価値を認めるべきだ。
      - どのような本にも先入観なしで接するべきだ。
    source_pages:
    - 9
    - 10
