schema_version: 1
section: R
groups:
- id: R8
  kind: reading
  title: 問題８
  instruction: 次の（１）から（４）の文章を読んで、後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。
  items:
  - id: R8-1
    stimulus:
    - type: paragraph
      text: 失敗はすべて、子どもがその後の人生を大過（注）なく生きるための血となり、肉となる。そう思えば、失敗する前に手を出すことがいかに愚かな教育か、わかろうというものです。
    - type: paragraph
      text: ただし、親は常に子どもをそばでしっかり見守っていなければなりません。手は出さないけれど、いつでも危険から救ってやれるよう、待機するのです。そうして、もし子どもが転んでケガをしたら、「ほら、痛いでしょう。ぶつからないように注意するのよ」と教えてやる。そういう姿勢が親に求められるのです。
    - type: paragraph
      text: （大宅映子『親の常識』による）
      style: small
      align: right
    - type: paragraph
      text: （注）大過：大きな過ち
      style: small
    questions:
    - id: R-q46
      source_number: 46
      prompt: 筆者が親に対して言いたいことは何か。
      options:
      - 子どもが失敗しなくなるまであきらめずに教えることが大切だ。
      - 子どもが失敗しないようあらかじめ教えることが大切だ。
      - 子どもが失敗するまでは何も言わずに見守ることが大切だ。
      - 子どもが失敗したとしてもそのまま見守ることが大切だ。
    label: （１）
    source_pages:
    - 4
    - 5
  - id: R8-2
    stimulus:
    - type: paragraph
      text: 以下は、ある会社がホームページに掲載したお知らせである。
    - type: box
      blocks:
      - type: paragraph
        text: ＜ミスヌマ健康食品株式会社＞ニュース
        align: center
      - type: paragraph
        text: 2014年10.14　健康食品［ビタミン生活Ｖ］に関するお知らせ
        align: right
      - type: paragraph
        text: お客様各位
        indent: 0
      - type: paragraph
        text: 平素は弊社商品にご愛顧を賜り、厚く御礼申し上げます。
      - type: paragraph
        text: さて、2014年9月8日より通販および弊社直営店舗での販売を開始いたしました［ビタミン生活Ｖ］は、情報番組での紹介もあって、当初の販売計画を大幅に上回り、生産が追いつかない状況となっております。そのため、すでに通販の受注を停止しておりますが、店舗販売も在庫がなくなり次第、一時中止せざるを得なくなりました。
      - type: paragraph
        text: 今後は生産体制を整え、11月17日に店舗販売のみ再開を予定しております。
      - type: paragraph
        text: お客様にご迷惑をおかけしますことを、深くお詫び申し上げます。
      - type: paragraph
        text: ミスヌマ健康食品株式会社
        indent: 0
      - type: paragraph
        text: お客様担当係：0120-333-4455
        indent: 0
      - type: paragraph
        text: ［受付時間10:00-18:00　土日祝休み］
        indent: 0
    questions:
    - id: R-q47
      source_number: 47
      prompt: 「ビタミン生活Ｖ」について、この文書は何を知らせているか。
      options:
      - 通販を一時中止して、しばらくの間店舗販売のみ行う。
      - 生産体制が整い次第、通販に加え店舗販売も再開する。
      - 在庫不足のため、現在は通販および店舗販売を中止している。
      - 販売は一時すべて中止になるが、後日店舗販売のみ再開する。
    label: （２）
    source_pages:
    - 5
  - id: R8-3
    stimulus:
    - type: paragraph
      text: 以下は、諦めについて書かれた文章である。
    - type: paragraph
      text: 人が自分の能力以上のことに憧れ、それがどうしても出来ないというのに、なお執着を持っているとしたら、登れない壁の下で、徒らにじたばたしているようなもので、気の毒でもありますが、滑稽でもあります。この場合は諦めが必要です。ただそれは、その次の、自分の能力に合った憧れなり、道なりを求めるためにのみ必要であって、諦めの中に憩ってしまうことは少し見当が外れていることになるかもしれません。
    - type: paragraph
      text: （串田孫一『考える葦』による）
      style: small
      align: right
    questions:
    - id: R-q48
      source_number: 48
      prompt: 筆者の考えに合うのはどれか。
      options:
      - 前へ進みたいなら、無理なことに執着せずに諦めることも必要だ。
      - 前へ進めない理由がわからないなら、諦めることが必要だ。
      - 能力を超えていると思っても、すぐに諦めてしまっては前へ進めない。
      - 能力に合った憧れや道を求めるなら、何事も諦めてはいけない。
    label: （３）
    source_pages:
    - 5
  - id: R8-4
    stimulus:
    - type: paragraph
      text: 私が35歳になったころ、「このごろは、少年時代に経験したような、ものすごい雷雨がなくなった」と口にしたことがあります。ところが、60歳ぐらいになったとき、35歳ぐらいの人から同じ言葉を聞いたのです。つまり、私が強い雷雨はなくなったと感じたとき、その人はまだ少年時代で、強い雷雨を経験していたことになります。この場合は、なくなったのは、少年時代特有の自然から受ける鮮烈な印象、驚き、恐れでしょう。
    - type: paragraph
      text: （倉嶋厚『日和見の事典――倉嶋厚の人文気象学ノート』による）
      style: small
      align: right
    questions:
    - id: R-q49
      source_number: 49
      prompt: 筆者の考えに合うのはどれか。
      options:
      - 少年時代に経験した雷雨の記憶は、人によって異なる。
      - 同じ雷雨でも、今の人は昔の人と同じような印象は受けない。
      - 大人になると、子供時代に経験した雷雨の記憶は薄れてしまう。
      - 昔も今も雷雨はあるが、大人になると子供のときほど強い印象は受けない。
    label: （４）
    source_pages:
    - 5
    - 6
- id: R9
  kind: reading
  title: 問題９
  instruction: 次の（１）から（３）の文章を読んで、後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。
  items:
  - id: R9-1
    stimulus:
    - type: paragraph
      text: 不安は、正体がつかみきれないときほど膨らんでいく。長く引きずる。
    - type: paragraph
      text: 人間だれでも、自分に都合の悪いこと、恐ろしいことは考えたくない。そういう心理が働くから、無意識のうちに問題をあいまいにして解決を保留にする。
    - type: paragraph
      text: そうして結局、__いつまでも不安をダラダラと抱え続けてしまう__。
    - type: paragraph
      text: 逆に自分の何がどのように不安なのか、不安に思う必要があるのかどうかを把握すれば、それだけで不安は減る。
    - type: paragraph
      text: 不安の正体が明確になって、これは何かしなくてはまずいと認識されれば、それは「危機感」になる。
    - type: paragraph
      text: 危機感は不安と違う。危機感をもてば、行動を起こそうという意欲が湧く。さらに情報を集めて、行動計画をたてようとする。やるべきことが明確になる。だからスタートが切れるのだ。
    - type: paragraph
      text: 問題は鍵となる不安は何なのかということだ。様々な不安の中から、それを特定して意識する。その不安は、思いきり光を当てて自分で正体を見極められれば、次にどうすればいいかの対策も講じられる。
    - type: paragraph
      text: （中略）
    - type: paragraph
      text: 不安には、しばらく保留にしておいても大丈夫な不安もある。それがわかった瞬間、不安は、また少し減る。
    - type: paragraph
      text: こうして、自分が何をやらなければいけないかが見えてくる。やる気が出てくる。動く気になる。不安の解決策を考えながら、夢が膨らんでくることもある。
    - type: paragraph
      text: （佐々木直彦『「仕事も人生もうまくいく人」の考え方』による）
      style: small
      align: right
    questions:
    - id: R-q50
      source_number: 50
      prompt: __いつまでも不安をダラダラと抱え続けてしまう__とあるが、なぜか。
      options:
      - 不安の原因がいくつもあって対処できないから。
      - 不安について考えることを避けてしまうから。
      - 不安が一人では解決できないほど大きいから。
      - 不安に向き合うと不安はさらに膨らんでいくから。
    - id: R-q51
      source_number: 51
      prompt: 筆者によると、危機感をもつとどうなるか。
      options:
      - 次の行動に移れる。
      - 行動に自信がもてる。
      - 不安の原因が把握できる。
      - 不安の正体を突き止めたくなる。
    - id: R-q52
      source_number: 52
      prompt: 不安について、筆者はどのように考えているか。
      options:
      - 解決しやすい不安から順々に対応するといい。
      - 保留にするべきではない不安をまず特定するといい。
      - 不安を感じたときはすぐに解決策を考えて実行するといい。
      - 不安の原因が何かわかるまでしばらく保留にしておくといい。
    label: （１）
    source_pages:
    - 6
  - id: R9-2
    stimulus:
    - type: paragraph
      text: 自分の泣いているときの表情や、笑ったときの表情をまともに見たことのある人は、まずない。
    - type: paragraph
      text: 写真やビデオになれば、自然な笑いがおさめられることもあるかもしれないが、そこに映っているのは過去のそれであって、__いま内側から生きている感情と重なり合う__ものではない。その点、鏡ならばそれを同時に捉えられそうにもみえる。しかし、じっさいには自分が笑っているとき、その笑っている自分の顔を見たとたん、もはや笑いつづけられなくて、さっと笑いがさめてしまうものである。泣いているときも同じである。（中略）
    - type: paragraph
      text: 自分の表情を視覚的に捉えることには、そもそも無理がある。他方、他者の表情を内的に捉えることも、私たちが他者の身体を内側から生きることができない以上、不可能である。ならば他者の表情の理解はほんらい不可能なことだということになるはずだが、私たちは日頃から、表情の理解が不可能だとか、困難だとか、ほとんど思いもしない。現に私たちは他者のわずかな表情の変化にも敏感であるし、その表情の理解を土台にすることで人間関係の基本部分を成り立たせている。
    - type: paragraph
      text: 表情は、ほぼ人類に共通であって、微妙な表情は別として、人種がちがっても、それを読み間違うことはまずない。含み笑いとか、苦笑い、あるいは愛想笑いとかいったものだと、同じく笑いでも文化差があって、読み間違うことがあるかもしれないが、典型的な表情に関してはまず間違わない。そうだとすれば類としての人間のなかに、表情を通して人どうしわかり合うメカニズムが、個の単位を越えて存在するものと考えねばならない。
    - type: paragraph
      text: （浜田寿美男『「私」とは何か』による）
      style: small
      align: right
    questions:
    - id: R-q53
      source_number: 53
      prompt: __いま内側から生きている感情と重なり合う__表情について、筆者はどのように考えているか。
      options:
      - 写真やビデオだけでなく、鏡でも見ることができる。
      - 写真やビデオはもちろん、鏡ですら見ることはできない。
      - 写真やビデオでは見られるが、鏡では見ることができない。
      - 写真やビデオでは見られないが、鏡では見ることができる。
    - id: R-q54
      source_number: 54
      prompt: 他者の表情を理解することについて、筆者はどのように考えているか。
      options:
      - 人間関係が成立すれば容易に理解できるが、それ以前には困難である。
      - 人間関係を成立させる上で理解が欠かせないが、現実には容易ではない。
      - 理解できないはずだが、現実には人間関係を構築する基盤になっている。
      - 理解しようと努力することが、人間関係を構築する上で役立っている。
    - id: R-q55
      source_number: 55
      prompt: 筆者の考えに合うものはどれか。
      options:
      - 表情から理解し合うことは、人間に備わったメカニズムだと考えられる。
      - 感情を表情で表現することは、人間に共通するメカニズムだと考えられる。
      - 他者の表情を理解するメカニズムは、経験を通して精巧になると考えられる。
      - 典型的な表情の違いを理解するメカニズムには、文化差があると考えられる。
    label: （２）
    source_pages:
    - 6
    - 7
  - id: R9-3
    stimulus:
    - type: paragraph
      text: 多くの大人は、子供よりも先に生きているから、自分の方が人生を知っていると思っている。しかしこれはウソである。彼らが知っているのは「生活」であって、決して「人生」ではない。生活の仕方、いかに生活するかを知っているのを、人生を知っていることだと思っている。そして生活を教えることが、人生を教えることだと間違えているのである。
    - type: paragraph
      text: しかし、「生活」と「人生」とはどちらも「ライフ」だが、この両者は大違いである。「何のために」生活するのと問われたら、どう答えるだろう。
    - type: paragraph
      text: こういう基本的なところで大間違いをしているから、小中学校で仕事体験をさせようといった愚にもつかない（注１）教育になる。（中略）生活の必要のない年齢には、生活に必要のないことを学ぶ必要があるのだ。それはこの年齢、このわずかな期間にのみ許された、きわめて貴重な時間なのだ。生活に必要のないことは、人生に必要なことだ。すなわち、人生とは何かを考えるための時間があるのは、この年代の特権なのである。
    - type: paragraph
      text: 「人生とは何か」とは、そこにおいて生活が可能となるところの生存そのもの、これを問う問いである。「生きている」、すなわち「存在する」とは、どういうことなのか。
    - type: paragraph
      text: この問いの不思議に気がつけば、どの教科も、それを純粋に知ることの面白さがわかるはずだ。国語においては言葉、算数においては数と図形、理科においては物質と生命、社会においては人倫（注２）、どれもこの存在と宇宙の不思議を知ろうとするものだと知るはずだ。人間精神の普遍的な営みとして、自分と無縁なものはひとつもない。どれも自分の人生の役に立つ学びだと知るはずなのだ。
    - type: paragraph
      text: （池田晶子『人間自身――考えることに終わりなく』による）
      style: small
      align: right
    - type: paragraph
      text: （注１）愚にもつかない：ここでは、ばかばかしい
      style: small
    - type: paragraph
      text: （注２）人倫：人として守るべき道
      style: small
    questions:
    - id: R-q56
      source_number: 56
      prompt: 多くの大人について、筆者はどのように考えているか。
      options:
      - 生活も人生もわかっていない。
      - 生活と人生の違いがわかっていない。
      - 生活と人生の両方を教えている。
      - 生活と人生の違いを教えている。
    - id: R-q57
      source_number: 57
      prompt: 筆者によると、子供にとって必要なのはどのような時間か。
      options:
      - 働くことの意義を考える。
      - 人生と生活の違いを学ぶ。
      - 生活に必要なことを学ぶ。
      - 人が生きている意味を考える。
    - id: R-q58
      source_number: 58
      prompt: 「人生とは何か」と問うことによって、筆者は何がわかると考えているか。
      options:
      - 自分がなぜ存在しているかということ
      - すべての学びが自分にとって有益だということ
      - 教科で扱われている事柄は生活に必要だということ
      - 人間が存在すること自体が不思議であるということ
    label: （３）
    source_pages:
    - 7
    - 8
- id: R10
  kind: reading
  title: 問題１０
  instruction: 次の文章を読んで、後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。
  items:
  - id: R10-art
    stimulus:
    - type: paragraph
      text: 以下は、ある芸術家が書いた文章である。
    - type: paragraph
      text: 人間は動物とちがって、知的な活動、その情熱をもっている。おさなくたって、魂の衝動は強いのだ。だから子供は描きたがる。形、色にして確かめる。だが問題は自分のなかにあるものを外に突き出す、投げ出すという行為自体であって、決して出来上がりの効果ではない。
    - type: paragraph
      text: だから子供は描きおわってしまったものはふり向きもしない。__捨てられたって何とも思わない__のだ、（中略）それを大事そうに拾いあげて、「これは面白い。」「坊やは才能がある。これをうまく伸ばせば、将来えらい画家になるかもしれない。」などと、観賞したり評価するのは、いつでも大人で、子供自身は、もしほめられても、そんなものかなと聞いているだけである。
    - type: paragraph
      text: だから「子供の絵」というような言い方の、根本に何か間違いがある、と私は思う。描いたものには違いないが、「作品」ではない。その以前の、もっと根源的な何ものかなのである。
    - type: paragraph
      text: 「絵」などというから、大人の「絵画作品」と混同して考えてしまう。そこにズレがおこる。大人のは見せる芸であり、商品である。はじめから観賞すること、してもらうことを目的とし、結果を予測しながら作り上げたものなのだ。
    - type: paragraph
      text: いわゆる「絵描きさん」となると、描いている瞬間瞬間に、結果がわかっている。こうやれば、こうなる。習練（注１）と経験によって、色やタッチ（注２）の効果が計算できるし、生命の衝動、情熱、無目的な行動よりも、結果の方に神経が働いてしまう。出来ばえに、逆にひきずり回されているのだ。
    - type: paragraph
      text: しかも、大向こう（注３）の気配まですでに見すかして、……こんな趣向は喜ばれるだろう、これはちょっとやりすぎかな、などと意識・無意識に、そんな手応えにあわせながら仕事をすすめている。評判をとり、買手がついてくれなければ食ってゆけないし、社会が許さない。生活はきびしいのだ。無償の行為というわけにはいかない。
    - type: paragraph
      text: 明らかに「作品」つまり「商品」を作っているのである。
    - type: paragraph
      text: 大人の作品だって、本質的には生命力こそ肝要なのだ。自分の存在を純粋に外に投げ出す、突き出すアクションの質、強さによって、猛烈な魅力になる。
    - type: paragraph
      text: 私自身は、少なくともそのつもりである。よく、あなたの絵はわけがわからないと言われるが、「絵」でございます、というようなものは作りたくない。それ以前、そして以後のものをひたすらつきつける。――絵ではなく、芸術。そして出来るかぎり他の評価を無視したいと思っている。
    - type: paragraph
      text: （岡本太郎『美しく怒れ』による）
      style: small
      align: right
    - type: paragraph
      text: （注１）習練：練習
      style: small
    - type: paragraph
      text: （注２）タッチ：ここでは、筆の使い方
      style: small
    - type: paragraph
      text: （注３）大向こう：ここでは、観賞する人々
      style: small
    questions:
    - id: R-q59
      source_number: 59
      prompt: __捨てられたって何とも思わない__のはなぜか。
      options:
      - いつでも描きたいものが描けるから。
      - 描きたいものが描けて納得したから。
      - 描きたいという欲求が満たされたから。
      - 最後まで描けたことに満足しているから。
    - id: R-q60
      source_number: 60
      prompt: 子供の描いたものが「作品」ではないのはなぜか。
      options:
      - 大人ほどの表現力や情熱をもって描かれていないから。
      - 観賞されることを目的として描かれていないから。
      - 評価に値する出来上がりになっていないから。
      - 描いた本人が価値を認めていないから。
    - id: R-q61
      source_number: 61
      prompt: 「絵描きさん」について、筆者はどのように述べているか。
      options:
      - かんぺきな出来ばえを求めている。
