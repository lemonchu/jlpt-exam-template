schema_version: 1
section: L
groups:
- id: L1
  kind: listening_choice
  title: ｜問題《もんだい》１
  instruction: ｜問題《もんだい》１では、まず｜質問《しつもん》を｜聞《き》いてください。それから｜話《はなし》を｜聞《き》いて、｜問題用紙《もんだいようし》の１から４の｜中《なか》から、｜最《もっと》もよいものを｜一《ひと》つ｜選《えら》んでください。
  items:
  - id: L1-q1
    source_number: 1
    prompt: ''
    options:
    - 抽選の準備をする
    - 講師に会場の変更を連絡する
    - 会場の予約を変更する
    - 当日使用する文房具を注文する
  - id: L1-q2
    source_number: 2
    prompt: ''
    options:
    - 学生課の掲示板でかくにんする
    - 担当の職員にかくにんする
    - ウェブ上でかくにんする
    - 先生にかくにんする
  - id: L1-q3
    source_number: 3
    prompt: ''
    options:
    - 試作品の味の改善案をていしゅつする
    - すでに行ったアンケートの結果を見る
    - 試作品のアンケートを実施する
    - 新商品の商品名をていあんする
  - id: L1-q4
    source_number: 4
    prompt: ''
    options:
    - はちのすのくじょを事務の人に依頼する
    - 殺虫剤を買いに行く
    - 裏口に張り紙をする
    - はちのすのことをほかの人に伝える
  - id: L1-q5
    source_number: 5
    prompt: ''
    options:
    - 予備調査の録画資料を分析する
    - 調査協力者を再募集する
    - 調査方法の改善点を一覧にまとめる
    - 先生に勧められた論文を読む
  - id: L1-q6
    source_number: 6
    prompt: ''
    options:
    - 製品の値引きを検討する
    - 製品の見積書を作り直す
    - 取引先に希望の納期を聞く
    - 工場の生産の予定をかくにんする
- id: L2
  kind: listening_choice
  title: ｜問題《もんだい》２
  instruction: ｜問題《もんだい》２では、まず｜質問《しつもん》を｜聞《き》いてください。そのあと、｜問題用紙《もんだいようし》のせんたくしを｜読《よ》んでください。｜読《よ》む｜時間《じかん》があります。それから｜話《はなし》を｜聞《き》いて、｜問題用紙《もんだいようし》の１から４の｜中《なか》から、｜最《もっと》もよいものを｜一《ひと》つ｜選《えら》んでください。
  items:
  - id: L2-q1
    source_number: 1
    prompt: ''
    options:
    - もう少していねいに作業したほうがいい
    - せんぱいの指示をよく聞いたほうがいい
    - じょうきょうに応じて仕事を進めたほうがいい
    - 職場では積極的に動いたほうがいい
  - id: L2-q2
    source_number: 2
    prompt: ''
    options:
    - 実務経歴の年数が足りないから
    - 会社の業務が忙しいから
    - 会社が受験をみとめてくれないから
    - 応募書類の準備が間に合わないから
  - id: L2-q3
    source_number: 3
    prompt: ''
    options:
    - メーカーの修理の担当者を手配する
    - 故障した洗濯機を新品と交換する
    - 故障した洗濯機を引き取って返金する
    - 客の家を訪問して故障の原因を調べる
  - id: L2-q4
    source_number: 4
    prompt: ''
    options:
    - てんぽ数拡大のひけつ
    - 失敗から学んだこと
    - 人材育成の方法
    - 経営者としての資質
  - id: L2-q5
    source_number: 5
    prompt: ''
    options:
    - 駐輪場を拡充し、イベント広場を新設する
    - 駐車場を拡充し、駅前に広場を新設する
    - 高層ビルを建て、その中に駐車場を設置する
    - 駅直結のビルを建て、その中に商店街を移す
  - id: L2-q6
    source_number: 6
    prompt: ''
    options:
    - 晴れが続き、気温は今週と同じぐらい
    - 晴れが続き、気温は今週より下がる
    - 雨が降りやすく、気温は今週と同じぐらい
    - 雨が降りやすく、気温は今週より下がる
  - id: L2-q7
    source_number: 7
    prompt: ''
    options:
    - 環境問題の解決には至らないと思うから
    - 無料のレジ袋をごみ袋として使いたいから
    - 買い物のたびに袋を持参するのが面倒だから
    - 袋の配布はサービスの一環だと考えるから
- id: L3
  kind: listening_memo
  title: ｜問題《もんだい》３
  instruction: ｜問題《もんだい》３では、｜問題用紙《もんだいようし》に｜何《なに》も｜印刷《いんさつ》されていません。この｜問題《もんだい》は、｜全体《ぜんたい》としてどんな｜内容《ないよう》かを｜聞《き》く｜問題《もんだい》です。｜話《はなし》の｜前《まえ》に｜質問《しつもん》はありません。まず｜話《はなし》を｜聞《き》いてください。それから、｜質問《しつもん》とせんたくしを｜聞《き》いて、１から４の｜中《なか》から、｜最《もっと》もよいものを｜一《ひと》つ｜選《えら》んでください。
  items:
  - id: L3-memo
    stimulus:
    - type: memo
      label: －メモ－
    questions: []
- id: L4
  kind: listening_memo
  title: ｜問題《もんだい》４
  instruction: ｜問題《もんだい》４では、｜問題用紙《もんだいようし》に｜何《なに》も｜印刷《いんさつ》されていません。まず｜文《ぶん》を｜聞《き》いてください。それから、それに｜対《たい》する｜返事《へんじ》を｜聞《き》いて、１から３の｜中《なか》から、｜最《もっと》もよいものを｜一《ひと》つ｜選《えら》んでください。
  items:
  - id: L4-memo
    stimulus:
    - type: memo
      label: －メモ－
    questions: []
- id: L5
  kind: listening_compound
  title: ｜問題《もんだい》５
  instruction: '｜問題《もんだい》５では、｜長《なが》めの｜話《はなし》を｜聞《き》きます。この｜問題《もんだい》には｜練習《れんしゅう》はありません。

    ｜問題用紙《もんだいようし》にメモをとってもかまいません。'
