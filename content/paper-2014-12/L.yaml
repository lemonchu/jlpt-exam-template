groups:
- id: L1
  kind: listening_choice
  title: ｜問題《もんだい》１
  instruction: ｜問題《もんだい》１では、まず｜質問《しつもん》を｜聞《き》いてください。それから｜話《はなし》を｜聞《き》いて、｜問題用紙《もんだいようし》の１から４の｜中《なか》から、｜最《もっと》もよいものを｜一《ひと》つ｜選《えら》んでください。
  items:
  - id: L1-q1
    source_number: 1
    prompt: ''
    options:
    - ｜抽選《ちゅうせん》の｜準備《じゅんび》をする
    - ｜講師《こうし》に｜会場《かいじょう》の｜変更《へんこう》を｜連絡《れんらく》する
    - ｜会場《かいじょう》の｜予約《よやく》を｜変更《へんこう》する
    - ｜当日《とうじつ》｜使用《しよう》する｜文房具《ぶんぼうぐ》を｜注文《ちゅうもん》する
  - id: L1-q2
    source_number: 2
    prompt: ''
    options:
    - ｜学生課《がくせいか》の｜掲示板《けいじばん》でかくにんする
    - ｜担当《たんとう》の｜職員《しょくいん》にかくにんする
    - ウェブ｜上《じょう》でかくにんする
    - ｜先生《せんせい》にかくにんする
  - id: L1-q3
    source_number: 3
    prompt: ''
    options:
    - ｜試作品《しさくひん》の｜味《あじ》の｜改善案《かいぜんあん》をていしゅつする
    - すでに｜行《おこな》ったアンケートの｜結果《けっか》を｜見《み》る
    - ｜試作品《しさくひん》のアンケートを｜実施《じっし》する
    - ｜新商品《しんしょうひん》の｜商品名《しょうひんめい》をていあんする
  - id: L1-q4
    source_number: 4
    prompt: ''
    options:
    - はちのすのくじょを｜事務《じむ》の｜人《ひと》に｜依頼《いらい》する
    - ｜殺虫剤《さっちゅうざい》を｜買《か》いに｜行《い》く
    - ｜裏口《うらぐち》に｜張《は》り｜紙《がみ》をする
    - はちのすのことをほかの｜人《ひと》に｜伝《つた》える
  - id: L1-q5
    source_number: 5
    prompt: ''
    options:
    - ｜予備調査《よびちょうさ》の｜録画資料《ろくがしりょう》を｜分析《ぶんせき》する
    - ｜調査協力者《ちょうさきょうりょくしゃ》を｜再募集《さいぼしゅう》する
    - ｜調査方法《ちょうさほうほう》の｜改善点《かいぜんてん》を｜一覧《いちらん》にまとめる
    - ｜先生《せんせい》に｜勧《すす》められた｜論文《ろんぶん》を｜読《よ》む
  - id: L1-q6
    source_number: 6
    prompt: ''
    options:
    - ｜製品《せいひん》の｜値引《ねび》きを｜検討《けんとう》する
    - ｜製品《せいひん》の｜見積書《みつもりしょ》を｜作《つく》り｜直《なお》す
    - ｜取引先《とりひきさき》に｜希望《きぼう》の｜納期《のうき》を｜聞《き》く
    - ｜工場《こうじょう》の｜生産《せいさん》の｜予定《よてい》をかくにんする
- id: L2
  kind: listening_choice
  title: ｜問題《もんだい》２
  instruction: ｜問題《もんだい》２では、まず｜質問《しつもん》を｜聞《き》いてください。そのあと、｜問題用紙《もんだいようし》のせんたくしを｜読《よ》んでください。｜読《よ》む｜時間《じかん》があります。それから｜話《はなし》を｜聞《き》いて、｜問題用紙《もんだいようし》の１から４の｜中《なか》から、｜最《もっと》もよいものを｜一《ひと》つ｜選《えら》んでください。
  items:
  - id: L2-q1
    source_number: 1
    prompt: ''
    options:
    - もう｜少《すこ》していねいに｜作業《さぎょう》したほうがいい
    - せんぱいの｜指示《しじ》をよく｜聞《き》いたほうがいい
    - じょうきょうに｜応《おう》じて｜仕事《しごと》を｜進《すす》めたほうがいい
    - ｜職場《しょくば》では｜積極的《せっきょくてき》に｜動《うご》いたほうがいい
  - id: L2-q2
    source_number: 2
    prompt: ''
    options:
    - ｜実務経歴《じつむけいれき》の｜年数《ねんすう》が｜足《た》りないから
    - ｜会社《かいしゃ》の｜業務《ぎょうむ》が｜忙《いそが》しいから
    - ｜会社《かいしゃ》が｜受験《じゅけん》をみとめてくれないから
    - ｜応募書類《おうぼしょるい》の｜準備《じゅんび》が｜間《ま》に｜合《あ》わないから
  - id: L2-q3
    source_number: 3
    prompt: ''
    options:
    - メーカーの｜修理《しゅうり》の｜担当者《たんとうしゃ》を｜手配《てはい》する
    - ｜故障《こしょう》した｜洗濯機《せんたくき》を｜新品《しんぴん》と｜交換《こうかん》する
    - ｜故障《こしょう》した｜洗濯機《せんたくき》を｜引《ひ》き｜取《と》って｜返金《へんきん》する
    - ｜客《きゃく》の｜家《いえ》を｜訪問《ほうもん》して｜故障《こしょう》の｜原因《げんいん》を｜調《しら》べる
  - id: L2-q4
    source_number: 4
    prompt: ''
    options:
    - てんぽ｜数《すう》｜拡大《かくだい》のひけつ
    - ｜失敗《しっぱい》から｜学《まな》んだこと
    - ｜人材育成《じんざいいくせい》の｜方法《ほうほう》
    - ｜経営者《けいえいしゃ》としての｜資質《ししつ》
  - id: L2-q5
    source_number: 5
    prompt: ''
    options:
    - ｜駐輪場《ちゅうりんじょう》を｜拡充《かくじゅう》し、イベント｜広場《ひろば》を｜新設《しんせつ》する
    - ｜駐車場《ちゅうしゃじょう》を｜拡充《かくじゅう》し、｜駅前《えきまえ》に｜広場《ひろば》を｜新設《しんせつ》する
    - ｜高層《こうそう》ビルを｜建《た》て、その｜中《なか》に｜駐車場《ちゅうしゃじょう》を｜設置《せっち》する
    - ｜駅直結《えきちょっけつ》のビルを｜建《た》て、その｜中《なか》に｜商店街《しょうてんがい》を｜移《うつ》す
  - id: L2-q6
    source_number: 6
    prompt: ''
    options:
    - ｜晴《は》れが｜続《つづ》き、｜気温《きおん》は｜今週《こんしゅう》と｜同《おな》じぐらい
    - ｜晴《は》れが｜続《つづ》き、｜気温《きおん》は｜今週《こんしゅう》より｜下《さ》がる
    - ｜雨《あめ》が｜降《ふ》りやすく、｜気温《きおん》は｜今週《こんしゅう》と｜同《おな》じぐらい
    - ｜雨《あめ》が｜降《ふ》りやすく、｜気温《きおん》は｜今週《こんしゅう》より｜下《さ》がる
  - id: L2-q7
    source_number: 7
    prompt: ''
    options:
    - ｜環境問題《かんきょうもんだい》の｜解決《かいけつ》には｜至《いた》らないと｜思《おも》うから
    - ｜無料《むりょう》のレジ｜袋《ぶくろ》をごみ｜袋《ぶくろ》として｜使《つか》いたいから
    - ｜買《か》い｜物《もの》のたびに｜袋《ふくろ》を｜持参《じさん》するのが｜面倒《めんどう》だから
    - ｜袋《ふくろ》の｜配布《はいふ》はサービスの｜一環《いっかん》だと｜考《かんが》えるから
- id: L3
  kind: listening_memo
  title: ｜問題《もんだい》３
  instruction: ｜問題《もんだい》３では、｜問題用紙《もんだいようし》に｜何《なに》も｜印刷《いんさつ》されていません。この｜問題《もんだい》は、｜全体《ぜんたい》としてどんな｜内容《ないよう》かを｜聞《き》く｜問題《もんだい》です。｜話《はなし》の｜前《まえ》に｜質問《しつもん》はありません。まず｜話《はなし》を｜聞《き》いてください。それから、｜質問《しつもん》とせんたくしを｜聞《き》いて、１から４の｜中《なか》から、｜最《もっと》もよいものを｜一《ひと》つ｜選《えら》んでください。
  items:
