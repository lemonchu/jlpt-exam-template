- id: G7
  kind: cloze
  title: 問題７
  instruction: 次の文章を読んで、文章全体の趣旨を踏まえて、〔41〕から〔45〕の中に入る最もよいものを、１・２・３・４から一つ選びなさい。
  items:
  - id: G7-cow
    stimulus:
    - type: paragraph
      text: 以下は、丑年の2009年1月7日に新聞に掲載された文章である。
    - type: box
      blocks:
      - type: heading
        text: 牛の気持ち
      - type: paragraph
        text: 子供の頃、十二支の民話（注１・２）を聞いたとき、私が気になったのは、とにかく牛のことだった。牛は、「自分は歩くのが遅いから、早めに出発しよう」とずいぶん早いうちから出発した。そして、一着でゴールする寸前であったにもかかわらず、自分の背中に乗っていた鼠に先を越されてしまう。
      - type: paragraph
        text: 牛がどんな気分だったか、と考えると切なくて仕方がない。自分の地道な努力が利用されることは、さぞかし悔しかったはずだ、と〔41〕。が、そのことを話すと、母は、「牛はあまり気にしなかったんだよ。十二支には入れたし。『モーいいか』と思ったくらい」と答えた。少しほっとした。確かに、十二支の一番目が、二番目に比べて特典があるとも思えない。怒るほどのことでも〔42〕。
      - type: paragraph
        text: さて先日、子供が指を怪我した。軽い打撲だとは思ったものの、小心者の私はすぐに整形外科へ向かった。車を走らせ、医院に辿り着くと駐車場がいっぱいで、これは混んでいるな、と焦った。エレベーターに乗ると、向こうから走ってくる男性がいる。閉まりかけの扉を開くが、相手は礼も言わずに乗り込んできて、目的階に到着すると当然のように先に降り、さっさと受付へと向かってしまった。
      - type: paragraph
        text: 「こちらのほうが先に来ていたではないか！」と言葉が出かかった。〔43〕頭を過ぎったのが、牛のことだ。「ゴール寸前で追い抜かれた牛は、この程度のことは気にかけなかったはずだ。ここは、『モーいいか』の精神だ」と思えたのだ。なるほど、牛のおかげで〔44〕、と私は気を良くし（注３）、その後、「十二支の民話」の本を探した。
      - type: paragraph
        text: 読んでみると、追い抜かれた牛の場面には、「とても悔しがり、『モーモー』と怒りました」と書いてある。何と、牛〔45〕怒ったのだ。そのことにショックは受けた。が、怒るべき時は怒る、これも大事なことだな、と私は調子よく考える。
      - type: paragraph
        text: 今年の私の目標は、「モーいいか」と「もう怒りました」をバランス良く使い分けることだ。
    - type: paragraph
      text: （伊坂幸太郎『3652――伊坂幸太郎エッセイ集』による）
      style: small
      align: right
    - type: paragraph
      text: （注１）十二支：十二年で一回りする暦。一年ずつを異なる動物で表す
      style: small
    - type: paragraph
      text: （注２）十二支の民話：十二支の動物を競争で決めたという話。一番目が鼠で、二番目が牛になった
      style: small
    - type: paragraph
      text: （注３）気を良くする：いい気分になる
      style: small
