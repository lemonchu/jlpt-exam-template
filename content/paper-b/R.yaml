            prompt: 筆者は「教養」をどのようなものだと考えているか。
            options:
              - 新たな気質を見いだすことができる学問や思想
              - 人それぞれの気質の中で｜育《はぐく》まれた学問や思想
              - 生きていくうえで必要な専門的な知識
              - 書物や学問から得られた多くの知識
  - id: R11
    kind: reading
    title: 問題１１
    instruction: 次のＡとＢは、子どもがテレビを見ることについての専門家の意見である。後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。
    items:
      - id: R11-television
        source_pages:
          - 13
          - 14
        stimulus:
          - type: heading
            text: Ａ
          - type: box
            blocks:
              - type: paragraph
                text: 乳幼児期の子どもは、身近な人とのかかわりあい、そして遊びなどの実体験を重ねることによって、人間関係を築き、心と身体を成長させます。ところが乳児期からの{{注1|メディア}}漬けの生活では、外遊びの機会を奪い、人とのかかわり体験の不足を招きます。実際、運動不足、睡眠不足そしてコミュニケーション能力の低下などを生じさせ、その結果、心身の発達の遅れや｜歪《ゆが》みが生じた事例が{{注2|｜臨床《りんしょう》の場}}から報告されています。このようなメディアの弊害は、ごく一部の影響を受けやすい個々の子どもの問題としてではなく、メディアが子ども全体に及ぼす影響の甚大さの警鐘と私たちはとらえています。特に{{注3|象徴機能}}が未熟な２歳以下の子どもや、発達に問題のある子どものテレビ画面への早期接触や長時間化は、親子が顔をあわせ一緒に遊ぶ時間を奪い、言葉や心の発達を妨げます。
              - type: paragraph
                text: （社団法人日本小児科医会＜http://jpa.umin.jp/download/media/proposal02.pdf＞2010年６月18日取得による）
                style: small
                align: right
          - type: separator
          - type: heading
            text: Ｂ
          - type: box
            blocks:
              - type: paragraph
                text: 専門家からは「テレビをやめて積極的に外遊びをしましょう」「自然の中で遊びましょう」という意見が聞かれますが、お母さんたちは進んでテレビを見せているのではなく、地域に出ても同世代の子どもがいない、昔と比べて自然がなくなった、という問題もあるのだと思います。（中略）
              - type: paragraph
                text: 多くの親は、テレビの長時間視聴がよくないことを自覚しており、見せる内容にも気を遣っています。生活の中からテレビを排除するだけではなく、一日に六時間も七時間も子どもにテレビを見せる親の背景に何があるのかを考えなければ、問題の根本的な解決にはならないのです。
              - type: paragraph
                text: したがって、私たちの生活スタイルと、子どもにとって望ましいテレビ視聴のあり方のバランスをとりながら、これらの検証を進める必要があるのではないでしょうか。
              - type: paragraph
                text: （小西行郎『早期教育と脳』光文社新書による）
                style: small
                align: right
          - type: paragraph
            text: （注１）メディア：ここでは、テレビやビデオ
            style: small
          - type: paragraph
            text: （注２）｜臨床《りんしょう》の場：実際の診察、治療の現場
            style: small
          - type: paragraph
            text: （注３）象徴機能：ここでは、身の回りのものを、例えば言葉などで表す働き
            style: small
        questions:
          - id: R-q62
            source_number: 62
            prompt: 子どもにテレビを長時間見せることについて、ＡとＢの観点はどのようなものか。
            options:
              - Ａは問題解決を意識した今後の課題を述べ、Ｂは批判的に現状を報告している。
              - Ａは解決を意識した問題提起をし、Ｂは問題の原因は社会的背景にあると指摘している。
              - Ａは影響の大きさを示して注意を喚起し、Ｂは問題解決を意識した今後の課題を述べている。
              - Ａは問題の原因は社会的背景にあると指摘し、Ｂは影響の大きさを示して注意を喚起している。
            source_pages:
              - 14
          - id: R-q63
            source_number: 63
            prompt: 子どもとテレビの関係について、ＡとＢはどのように述べているか。
            options:
              - Ａはメディアとの接触より親子のかかわりが大切だと述べ、Ｂはテレビを見せるよりも外での遊びを重視したほうがいいと述べている。
              - Ａはメディアとの接触が子どもの発育を妨げる要因だと述べ、Ｂは子育てを取り巻く状況がテレビの見せ過ぎを引き起こす場合があると述べている。
              - Ａはメディアとの接触が長いことよりも実体験の不足のほうが問題だと述べ、Ｂは生活の中からテレビを排除しただけでは問題は解決しないと述べている。
              - Ａはメディアに長時間接することが子どもの成長に影響を与える場合が多いと述べ、Ｂは親が子どもに適切にテレビを見せることが大切だと述べている。
            source_pages:
              - 14
  - id: R12
    kind: reading
    title: 問題１２
    instruction: 次の文章を読んで、後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。
    items:
      - id: R12-thought-and-manners
        source_pages:
          - 15
          - 16
          - 17
        stimulus:
          - type: paragraph
            text: 最近、思想を表現する方法について考えることが多くなった。たとえば、文章は思想を表現する方法のひとつだけれど、その文章にもいろいろな表現形式がある。哲学の勉強をはじめた｜頃《ころ》の私は、さまざまな形式のなかで論文という形式だけが、思想表現の方法にふさわしいと思っていた。
          - type: paragraph
            text: しかし、後に、この考え方を訂正しなければならなくなった。思想の表現として、論文が唯一の方法だということは絶対にない。私たちは、すぐれたエッセーや小説、詩をとおして、しばしば思想を学びとる。とすれば、思想を表現する文章のかたちは、自在であってよいはずである。
          - type: paragraph
            text: ところが、そう考えてもまだ問題はある。というのは、思想の表現形式は、文章というかたちをとるとは限らないのだから。絵でも彫刻でも、音楽でも、つまり実にさまざまなものを用いて、思想を表現するのは可能なはずである。そのなかには、__かたちにならないもの__もある。
          - type: paragraph
            text: たとえば私の村に暮らす人々のなかに、自然に対する深い思想をもっていない人など一人もいない。村の面積の96パーセントを森や川がしめるこの村で、自然に対する思想をもたなかったら、人は暮らしていけない。ところが村人は、＜自然について＞などという論文を書くことも、文章を書くこともないのである。そればかりか、自分の自然哲学を、絵や音楽で表現しようとも考えない。
          - type: paragraph
            text: そんなふうにみていくと、村人は自然に対してだけではなく、農についての深い思想や、村とは何かという思想をもっているのに、それらを何らかのかたちで表現することも、またないのである。
          - type: paragraph
            text: とすると、村人たちは、どんな方法で自分たちの思想を表現しているのであろうか。私は、それは、＜作法＞をとおしてではないかという気がする。
          - type: paragraph
            text: （中略）
          - type: paragraph
            text: 考えてみれば、もともとは、作法は、思想と結びつきながら伝承されてきたものであった。たとえば昔は、食事の作法を厳しくしつけられた。食べ物を残すことはもちろんのこと、さわぎながら食事をすることも、けっしてしてはいけなかった。それは、食事は生命をいただくものだ、という厳かな思想があったからである。｜茶碗《ちゃわん》の中の米だけをみても、人間はおそらく何万という生命をいただかなければならない。だから、そういう人間のあり方を考えながら、いま自分の身体のなかへと移ってくれる生命に感謝する。この思想が食事の作法をつくりだした。
          - type: paragraph
            text: ところが、近代から現代の思想は、このような、日々の暮らしとともにあった思想を無視したのである。その結果、思想は、文章という表現形式をもち、文章を書く思想家のものになった。そして、いつの間にか人間の上に君臨し、現実を支配する手段になっていった。
          - type: paragraph
            text: （内山節『「里」という思想』新潮社による）
            style: small
            align: right
        questions:
          - id: R-q64
            source_number: 64
            prompt: __かたちにならないもの__として筆者が挙げているのはどれか。
            options:
              - 自然
              - 生命
              - 感謝
              - 作法
            source_pages:
              - 16
          - id: R-q65
            source_number: 65
            prompt: この文章中で筆者は、自分の村に暮らす人々がどんな思想をもっていると述べているか。
            options:
              - 自然の中で生きるための思想や、農業や村のあり方についての思想
              - 自然を壊さずに暮らすために、農業や村人はどうあるべきかという思想
              - 自然に対する感謝を表すために、村人としてどうするべきかという思想
              - 自然を取り戻すための思想や、自然を利用する農業のあり方についての思想
            source_pages:
              - 16
          - id: R-q66
            source_number: 66
            prompt: 食事の作法は、次のどのような考え方と結びついているか。
            options:
              - 多くの労力がささげられて作られた食べ物が、いかに尊いものであるかという考え方
              - 何かを食べないでは生きてはいけない人間のあり方が、いかに罪深いものであるかという考え方
              - 食事は農が生み出したものをいただくものであり、農業を営む村人への感謝が必要だという考え方
              - 食事は他の生命を自分の身体に取り入れるものであり、それらの生命に感謝しなければいけないという考え方
            source_pages:
              - 16
          - id: R-q67
            source_number: 67
            prompt: この文章中で筆者が述べていることはどれか。
            options:
              - 思想の表現は必ずしも文章や作品というかたちをとるとは限らず、かたちにならないものもある。
              - 思想は絵や音楽のようなかたちに表わされるものと考えられてきたが、深い思想とはかたちにならないものである。
              - 思想の表現には絵や音楽などもあるし、かたちにならないものもあるが、文章で表現されたものが最上のものである。
              - 思想は文章や作品のようなかたちになったものが尊重されるが、生活と結びついた深い思想はかたちにならないものである。
            source_pages:
              - 17
  - id: R13
    kind: reading
    title: 問題１３
    instruction: 右のページは、清森市が主催する「秋の美術コンクール」の作品募集の案内である。高木さんは、今回このコンクールに応募しようと思っている。下の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。
    items:
      - id: R13-art-contest
        source_pages:
          - 19
          - 20
        stimulus:
          - type: image
            asset: assets/B-R13-art-contest.png
            alt: |-
              清森市 秋の美術コンクール
              作品募集
              部門：絵画部門、写真部門
              募集期間：2010年11月1日～11月30日
              審査員：山田太郎（日本アート協会会長）、山本花子（画家）、川上次郎（写真家）
              応募規定：
              １ 清森市内の秋を題材にしたもの。
              ２ 絵画部門に出品する作品は、イラスト、水彩画、油絵、どれでも可。写真部門に出品する写真は、フィルム写真、デジタル写真、どちらも可。
              ※応募作品は各部門１人１点に限ります。
              ※作品の制作年は問わないが、未発表のものに限ります。（他のコンクールに入賞していたり、出版物や展示会などで公表されたりしていないものであること。）
              応募方法：郵送、または持参。ただし、郵送中の事故について、市は責任を負いません。指定の応募用紙を作品裏側に添付のこと。応募用紙は市役所の窓口で、または市のホームページ（http://www.kiyomori-shi.jp）から入手可能。
              応募先：清森市商業観光課観光係（〒951-0022 清森市清森2-8、TEL 084-874-8524）
              賞：
              最優秀賞：各部門１点、賞状と副賞（デジタル一眼レフカメラ）
              優秀賞：各部門２点、賞状と副賞（清森ホテルのペア宿泊券）
              清森賞：各部門20点以内、賞状と副賞（図書カード５千円分）
              審査結果：清森市のホームページ上に１月15日に発表します。入賞者には１月中に結果を郵送します。電話および窓口での問い合わせには応じられません。
              表彰式：2011年２月下旬（予定） 最優秀賞と優秀賞の方には、表彰式で賞状および副賞をお渡しします。
              注意事項：
              ※入賞作品は、１年を限度に主催者がお預かりして広報活動などに使用し、１年後にお返しします。
              ※上記の応募規定を守っていなかった場合には入賞が取り消されることがあります。
              〈主催〉清森市 〈協賛〉昭和デザイン株式会社、山手百貨店、新東京鉄道、清森ホテル
        questions:
          - id: R-q68
            source_number: 68
            prompt: 高木さんが制作した以下の作品のうち、応募できるものはどれか。
            options:
              - 清森高校に通っていたとき入賞した秋の風景画
              - 清森市にある清森温泉の紅葉の油絵とイラスト
              - 清森市にある清森公園で撮った春の木々の写真
              - 去年清森市で行われた秋祭りの写真と水彩画
            source_pages:
              - 19
          - id: R-q69
            source_number: 69
            prompt: 入賞したかどうかを知るには、高木さんはどうしたらよいか。
            options:
              - １月中旬に清森市のホームページを見る。
              - １月中旬に直接、観光係に電話して聞く。
              - ２月下旬に市役所の窓口に問い合わせる。
              - ２月下旬に届く予定の通知を待つ。
            source_pages:
              - 19
