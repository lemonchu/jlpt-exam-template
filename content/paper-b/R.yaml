# Paper B. source_pages は N1R(1).pdf の PDF ページ番号（1始まり）。
schema_version: 1
section: R
groups:
  - id: R8
    kind: reading
    title: 問題８
    instruction: 次の（１）から（３）の文章を読んで、後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。
    items:
      - id: R8-1
        label: （１）
        source_pages:
          - 1
        stimulus:
          - type: paragraph
            text: 食器のバラエティこそ、日本の{{注|やきもの}}の特色の一つだと思います。そして、日本人のやきものに対する思いとか愛着は、食器のみならず、種類の豊富さにあらわれているといってもいいでしょう。
          - type: paragraph
            text: 私たちは食事のたびに、もちろん料理も食べていますが、知らずに目で食器も食べているのです。だから興味・関心がないというのは、不注意なだけなのです。すでに下地はできているのですから、あと一歩踏みこめば、やきものに興味・関心がグッと深まるはずなのだと思います。
          - type: paragraph
            text: （江口滉『やきものの世界』岩波書店による）
            style: small
            align: right
          - type: paragraph
            text: （注）やきもの：陶芸品
            style: small
        questions:
          - id: R-q46
            source_number: 46
            source_pages:
              - 1
            prompt: 筆者の考えに合うのはどれか。
            options:
              - 食事のたびに食器を眺めることで、陶芸品への愛着が強まる。
              - 日常使う食器に注意を向けることで、陶芸品への関心が高まる。
              - 食器を通して陶芸品に興味を持つことで、芸術全般への関心が高まる。
              - 家庭にいろいろな食器を取り入れることで、陶芸品への愛着が強まる。
      - id: R8-2
        label: （２）
        source_pages:
          - 2
        stimulus:
          - type: box
            blocks:
              - type: vertical
                text: |-
                  おとなは子どもに「｜嘘《うそ》つきは泥棒のはじまり」として正直であることを強要しますが、弱者は苦しい｜嘘《うそ》をついてでも自らの尊厳を守ろうとします。
                  論理的に正しいことを理性と呼ぶとすれば、理性的にあることができるのは強者だからです。強者はそれゆえに理性的に弱者の過ちを責めようとしますが、弱者の立場からいえば、それは何の意味も持たないことが多いのです。弱者のする謝罪とは、劣勢を一時的に解消する手続きや儀式にすぎないのです。
              - type: paragraph
                text: （吉田脩二『ヒトとサルのあいだ―｜精神《こころ》はいつ生まれたのか』文藝春秋による）
                style: small
                align: right
        questions:
          - id: R-q47
            source_number: 47
            source_pages:
              - 2
            prompt: 筆者は、弱者をどのようにとらえているか。
            options:
              - 弱者は正直であることで自らの尊厳を守ろうとする。
              - 弱者は理性を持って自らの過ちをわびようとする。
              - 弱者は正論に頼って劣勢を解消しようとする。
              - 弱者は謝罪することで自らを守ろうとする。
      - id: R8-3
        label: （３）
        source_pages:
          - 3
        stimulus:
          - type: paragraph
            text: 思春期を迎えた最近の子どもがストレスに弱いのは、それまでの発達過程で適度にストレスにさらされる経験を十分にへてこなかったことが深く関係している。しかもそれは、彼らが社会化を十分に遂げてこなかったことと等しい。というのも、10代前半までの子どもは、それまでの生活圏を出てより広い社会的文脈のなかでいかにして自己を実現させるかという課題に取り組むなかで、もっとも強くストレスを味わうからにほかならない。
          - type: paragraph
            text: （正高信男『父親力』中央公論新社による）
            style: small
            align: right
        questions:
          - id: R-q48
            source_number: 48
            source_pages:
              - 3
            prompt: 筆者は、思春期を迎える前の子どもにとってどんな経験が必要だと考えているか。
            options:
              - 家庭の外の社会で多くの社会問題に取り組む経験
              - 日々の生活の場で自分自身と向き合うような経験
              - 広い社会の中で自分を鍛えることができるような経験
              - 日常生活の中で個人の発達段階に応じた役割を担う経験
  - id: R9
    kind: reading
    title: 問題９
    instruction: 次の（１）から（３）の文章を読んで、後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。
    items:
      - id: R9-1
        label: （１）
        source_pages:
          - 5
          - 6
        stimulus:
          - type: paragraph
            text: 以前、花見をしている時に「桜の花は本当にきれいな{{注1|正五角形}}だね」と言ったら、風情のない人だと笑われたことがあった。確かに、桜の花びらには微妙な色合いや形、そして香りに加えて、散りゆく美しさがある。花を｜愛《め》でる和歌や俳句は数限りないが、そのなかに「正五角形」という言葉が使われたことはおそらく一度もないであろう。科学者特有の美意識は、風流とはかなり異質なものなのだと悟った。
          - type: paragraph
            text: 科学において本質以外を切り捨てるためには、大胆な抽象化と理想化が必要である。桜の花びらのたくさんの特徴の中から、「正五角形」という形だけを取り出すこと。これが抽象化である。実際に数学的な意味で完全な正五角形を示す花びらは少ないだろうが、そこにはあまりこだわらない。これが__理想化__である。
          - type: paragraph
            text: 自然界で正五角形のような対称性を示すためには、必ず規則的な法則があるはずである。花の場合、品種によって{{注2|｜花弁《かべん》}}の回転対称性が遺伝子で決定されていることは間違いないから、うまくこの遺伝子を突きとめられれば、花の形を決める普遍的な法則が見つかるに違いない。このように、抽象化と理想化によって自然現象は単純に整理でき、普遍的な法則を見つける助けになる。
          - type: paragraph
            text: （酒井邦嘉『科学者という仕事』中央公論新社による）
            style: small
            align: right
          - type: paragraph
            text: （注１）正五角形：五つの辺の長さが等しい五角形
            style: small
          - type: paragraph
            text: （注２）｜花弁《かべん》：花びら
            style: small
        questions:
          - id: R-q49
            source_number: 49
            source_pages:
              - 5
            prompt: 筆者は、自分が笑われた原因はどこにあると考えているか。
            options:
              - 科学者らしくない趣のある表現で桜の花を褒めた点
              - 自分が桜の美しさを理解できていなかった点
              - 桜の花は自分が述べた形をしていなかった点
              - 桜の美しさを科学者的な視点から表現した点
          - id: R-q50
            source_number: 50
            source_pages:
              - 6
            prompt: ここでの__理想化__とは何か。
            options:
              - 桜の花はどれも正五角形であるとみなすこと
              - 桜の花には共通する特徴があるとみなすこと
              - 桜の花には数学的な美しさがあると考えること
              - 桜の花は他のどの花よりも正五角形に近いと考えること
          - id: R-q51
            source_number: 51
            source_pages:
              - 6
            prompt: 筆者の考えによると、花の場合、抽象化と理想化によって何が期待されるか。
            options:
              - 花には品種を越えた共通点があることが明らかになること
              - 自然界に咲いている花の美しさに普遍性が見いだされること
              - 花の形がどのように決まるのかその仕組みが解明されること
              - 花の形の対称性が遺伝子によるものであることが証明されること
      - id: R9-2
        label: （２）
        source_pages:
          - 7
          - 8
        stimulus:
          - type: paragraph
            text: 住居を買おうとするときは、その資産的な価値に重点を置いて考える人が多い。普通の人にとっては、一生に一度の買い物とでもいうべきもので、多額の金を費やさなくてはならないので、当然のことだ。買った後で、何らかの事情で売らなくてはならない羽目になったときに、価値が減少していたのでは、大損害を被る。
          - type: paragraph
            text: だが、住居にとってより重要なのは、その{{注1|有用性}}である。住みやすさが必要なのはもちろんだが、自分のライフスタイルに合った構造になっているとか、生活のしやすい環境にあって{{注2|利便性}}に富んでいるとかの点も、重要な要素である。それらは必ずしも__世間一般の価値基準__とは一致しない。したがって、自分たちの考え方や行動様式に従い、それに照らし合わせて判断する必要がある。
          - type: paragraph
            text: 特に、{{注3|｜終《つい》の｜住処《すみか》}}として考えるときには、自分たちの生き方をはっきりと見極め、その視点に立ったうえで、選択し決めていかなくてはならない。年を取ってくれば、当然のことながら、行動する能力は衰えてきて、動き回る範囲は狭まってくる。
          - type: paragraph
            text: 自分たちの余生がどのようなものになるかについて、計画を立てたうえに想像力を働かせて、確実性の高い予測を組み立ててみる。その未来図に従って、住むべき場所の見当をつけ、住居の大きさや構造などを決めていく。もちろん、将来の経済状勢の大きな変化に備えて、予算を大きく下回る出費に抑えておくことも必要であることは、いうまでもない。
          - type: paragraph
            text: （山﨑武也『シニアこそ都会に住もう―田舎暮らしは不安がいっぱい』PHP研究所による）
            style: small
            align: right
          - type: paragraph
            text: （注１）有用性：役に立つこと
            style: small
          - type: paragraph
            text: （注２）利便性：便利さ
            style: small
          - type: paragraph
            text: （注３）｜終《つい》の｜住処《すみか》：人生を終えるまで住む家
            style: small
        questions:
          - id: R-q52
            source_number: 52
            source_pages:
              - 7
            prompt: __世間一般の価値基準__として筆者が本文であげているのは何か。
            options:
              - 長期にわたって居住できる物件であること
              - 将来売却するときにも有利な物件であること
              - 購入者の生活様式に合った物件であること
              - 購入時の費用負担が抑えられる物件であること
          - id: R-q53
            source_number: 53
            source_pages:
              - 8
            prompt: 筆者の考えでは、年を取ってから住む家として住居を選ぶときに最も大切なことは何か。
            options:
              - 老後の生き方や行動範囲に沿っているかを判断する。
              - 老後は行動する能力が衰えるため家の構造を優先する。
              - 未来の予測に沿って決めた予算と同じくらいのものを選ぶ。
              - いつか売るときのことも考えて資産的な価値を重視する。
          - id: R-q54
            source_number: 54
            source_pages:
              - 8
            prompt: 住居選びについて、筆者が最も言いたいことは何か。
            options:
              - 人が生活する上でどんな住居に住むかはとても大切であり、一般的な価値基準も参考にしたほうがよい。
              - 他人と考え方が異なったとしても、自分の生活スタイルを重視して将来の住居を決定したほうがよい。
              - 将来の経済状勢の変化に備えて、できるだけ資産価値の下がりにくそうな住居を選んだほうがよい。
              - 年を取るにつれて住居の好みも変わってくるため、その時々の考えに合わせて住居を選択したほうがよい。
      - id: R9-3
        label: （３）
        source_pages:
          - 9
          - 10
        stimulus:
          - type: paragraph
            text: 人間は、｜所詮《しょせん》、時代の子であり、環境の子である。わたしたちの認識は、自分の生きてきた時代や環境に大きく左右される。ある意味、閉じ込められているといってもいい。認識できる「世界」はきわめて限定的なのであり、時代や環境の制約によって、認識の{{注1|｜鋳型《いがた》}}ができてしまうから、場合によっては、大きく｜歪《ゆが》められた「世界」像しか見えなくなることもある。わたしたちは、①__そういう宿命__を背負っているのである。
          - type: paragraph
            text: だから、「世界を知る」といいつつ、実は、｜偏狭《へんきょう》な認識の｜鋳型《いがた》で「世界」を{{注2|くり｜貫《ぬ》いて}}いるだけということが生じたりする。｜鋳型《いがた》が同じであるかぎり、断片的な情報をいくら集めたところで、「世界」の認識は何も変わらない。固まった世界認識をもつことは、「世界」が大きく変化する状況では非常に危険なことである。
          - type: paragraph
            text: 一方で、これほど情報環境が発達したにもかかわらず、②__「世界を知る」ことがますます困難になった__と感じている人も増加している。果てしなく{{注3|｜茫漠《ぼうばく》}}と広がり、しかも絶えず激動する「世界」が、手持ちの世界認識ではさっぱり見えなくなってきているからだ。たしかに、ただ｜漫然《まんぜん》とメディアの情報を眺めているだけでは｜激流《げきりゅう》に｜呑《の》み込まれてしまう。
          - type: paragraph
            text: いまこそ、時代や環境の制約を乗り越えて、「世界を知る力」を高めることが痛切に求められているのではないか。
          - type: paragraph
            text: もちろん、時代や環境の制約から完全に自由になることはない。しかし、凝り固まった認識の｜鋳型《いがた》をほぐし、世界認識をできるだけ柔らかく広げ、自分たちが背負っているものの見方や考え方の限界がどこにあるのか、しっかりとらえ直すことはできるはずだ。
          - type: paragraph
            text: （寺島実郎『世界を知る力』PHP研究所による）
            style: small
            align: right
          - type: paragraph
            text: （注１）｜鋳型《いがた》：ここでは、画一化した型
            style: small
          - type: paragraph
            text: （注２）くり｜貫《ぬ》いて：ここでは、切り取って
            style: small
          - type: paragraph
            text: （注３）｜茫漠《ぼうばく》：広がりがあり過ぎて、はっきりしない様子
            style: small
        questions:
          - id: R-q55
            source_number: 55
            source_pages:
              - 9
            prompt: ①__そういう宿命__とはどういう意味か。
            options:
              - 現代の人々は考えが時代や環境に｜歪《ゆが》められ、「世界」の見方が定まらない。
              - 現代の人々は時代や環境の制約を受けており、「世界」が正しく見えないこともある。
              - 人間はものの見方が時代や環境に縛られ、「世界」が正しく見えないこともある。
              - 人間は生き方が時代や環境に大きく影響を受け、「世界」の見方が定まらない。
          - id: R-q56
            source_number: 56
            source_pages:
              - 10
            prompt: ②__「世界を知る」ことがますます困難になった__のはなぜか。
            options:
              - 個人の世界認識が狭まり、実世界の時代の変化をつかみにくいから
              - 個人の世界認識が固まらず、実世界の情報に惑わされてしまうから
              - 個人の世界認識が、実世界のめまぐるしい変化や情報量に対応できないから
              - 個人の世界認識が、高度に発達している実世界の情報環境に追いつけないから
          - id: R-q57
            source_number: 57
            source_pages:
              - 10
            prompt: 筆者は、「世界を知る力」を高めるためにできることは何だと考えているか。
            options:
              - 今までの世界認識を改め、できるだけ多くの情報を得ること
              - 時代や環境の制約を克服して、自分の世界認識の限界を越えること
              - 情報の｜激流《げきりゅう》に｜呑《の》み込まれず、自分の世界認識の枠から自由になること
              - 自分の世界認識にできるだけ柔軟性を持たせ、その範囲を自覚すること
  - id: R10
    kind: reading
    title: 問題１０
    instruction: 次の文章を読んで、後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。
    items:
      - id: R10-1
        source_pages:
          - 11
          - 12
        stimulus:
          - type: paragraph
            text: 我が身が生涯に望み、知りうることは、世界中を旅行しようと、何をしようと、小さい。あきれるくらい小さいのだが、この小ささに耐えていかなければ、学問はただの{{注1|｜大風呂敷《おおぶろしき》}}になる。言葉の｜風呂敷《ふろしき》はいくらでも広げられるから、そうやっているうちに自分は世界的に考えている、そのなかに世界のすべてを包める、①__そんな錯覚に捕らえられる__。木でいい家を建てる大工とか、米や野菜を立派に育てる｜農夫《のうふ》とかは、そういうことにはならない。世界的に木を削ったり、世界標準の稲を育てたりはできないから、彼らはみな、自分の仕事において賢明である。我が身ひとつの能力でできることを知り抜いている。学問をすること、書物に学ぶことは、ほんとうは②__これ__と少しも変わりはない。なぜなら、そうしたことはみな、我が身ひとつが天地の間でしっかりと生きることだからだ。
          - type: paragraph
            text: 人は世界的にものを考えることなどはできない。それは錯覚であり、空想であり、愚かな思い上がりである。ただし、天地に向かって我が身を開いていることならできる。我が身ひとつでものを考え、ものを作っているほどの人間なら、それがどういう意味合いのことかは、もちろん知っている。人は誰でも自分の気質を背負って生まれる。学問する人にとって、この気質は、｜農夫《のうふ》に与えられる土壌のようなものである。土壌は天地に開かれていなければ、{{注2|ひからびて}}不毛になる。
          - type: paragraph
            text: 与えられたこの土を耕し、水を引き、苗を植える。苗がみずから育つのを、毎日助ける。苗とともに、自分のなかで何かが育つのを感じながら。学問や思想もまた、人の気質に植えられた苗のように育つしかないのではないか。子供は、勉強して自分の気質という土を耕し、水を引き、もらった苗を、書物の言葉を植えるのである。それは、子供自身が何とかやってみるほかはなく、そうやってこそ、子供は学ばれる書物とともに育つことができる。子供が勉強をするのは、自分の気質という土壌から、やがて実る精神の作物を育てるためである。「教養」とは、元来この作物を指して言うのであって、{{注3|｜物識《ものし》り}}たちの｜大風呂敷《おおぶろしき》を指して言うのではない。
          - type: paragraph
            text: （前田英樹『独学の精神』筑摩書房による）
            style: small
            align: right
          - type: paragraph
            text: （注１）｜大風呂敷《おおぶろしき》：実際より大きく見せたり言ったりすること
            style: small
          - type: paragraph
            text: （注２）ひからびて：乾ききって
            style: small
          - type: paragraph
            text: （注３）｜物識《ものし》り：物事をよく知っている人
            style: small
        questions:
          - id: R-q58
            source_number: 58
            source_pages:
              - 12
            prompt: ①__そんな錯覚に捕らえられる__とはどういう意味か。
            options:
              - 自分は何でも知っていて世界を相手にできると思う。
              - 言葉でどんなことでも伝えられるような気になる。
              - 学問から得られることには限界がないと感じてしまう。
              - 人間が世界から学べることはいかに大きいことかと思う。
          - id: R-q59
            source_number: 59
            source_pages:
              - 12
            prompt: ②__これ__とは何を指すか。
            options:
              - 自分にできることを把握したうえで仕事をすること
              - 自分が世界のために何ができるかを考えて仕事に励むこと
              - できる限り多くの知識を得て自分の仕事に役立たせること
              - 人のためにできることは何かを考えたうえで仕事をすること
          - id: R-q60
            source_number: 60
            source_pages:
              - 12
            prompt: この文章では、学問をするということをどのような例を使って説明しているか。
            options:
              - 与えられた土を耕し、よい苗を選んで植える。
              - 与えられた土を耕し、よい作物になるように苗を育てる。
              - 与えられた土壌を改善するために耕し続ける。
              - 与えられた土壌を改善しながら世界標準の作物を育てる。
          - id: R-q61
            source_number: 61
