- id: G7
  kind: cloze
  title: 問題７
  instruction: 次の文章を読んで、文章全体の趣旨を踏まえて、〔41〕から〔45〕の中に入る最もよいものを、１・２・３・４から一つ選びなさい。
  items:
  - id: G7-article
    source_pages:
    - 5
    - 6
    stimulus:
    - type: box
      blocks:
      - type: heading
        text: 広告主の品位
      - type: paragraph
        text: きょうはＣＭの中身ではなく、ＣＭの出し方について、広告主の人たちにお願いをしたい。
      - type: paragraph
        text: 番組の途中にＣＭが〔41〕。が、モンダイはその入り方のタイミングだ。たとえば、歌やものまねのうまさを競い合う番組の中で、いざ、審査員の点数が出ようとするその直前に、ポンとＣＭが割って入る。あるいは、クイズ番組の中で正解が発表されようとするその瞬間に、サッと画面がＣＭに入れ替わる。ああいう{{注1|せこい}}ことは〔42〕。
      - type: paragraph
        text: あれは広告主がやっているわけでなく、番組を作っているテレビ局の人の考えでやっているんだろう。が、それだったら、そういういやらしいＣＭの入れ方はしないでほしいと、テレビ局の人に注文をつけてもらいたい。
      - type: paragraph
        text: 〔43-a〕、みんながテレビの前で身を乗り出している瞬間にＣＭを入れれば、見られる〔43-b〕。が、わざわざ番組の流れを断ち切り、視聴者の{{注2|｜感興《かんきょう》をそいで}}まで強引にＣＭを見せようとするやり方って、さもしくないだろうか。みっともなくないだろうか。
      - type: paragraph
        text: ＣＭのセンスは、企業のセンスのあらわれである。それはＣＭの中身だけでなく、ＣＭの出し方にも言えることだ。せっかくいいＣＭを作っても、ああいう出し方をされると、なんと視聴者をバカにした企業だろうと思われてしまう。いやおうなしに〔44〕ああいうやり方は、極端に言えば暴力みたいなものであって、消費者を大切に思う企業のやることじゃない。
      - type: paragraph
        text: 近ごろハヤリの言葉で言えば、これは企業の「品位」にかかわるモンダイである。〔45-a〕だけじゃない、〔45-b〕だいぶ前から、「品がねえぞ」と怒ってるよ。
    - type: paragraph
      text: （天野祐吉　朝日新聞２００８年４月１５日付朝刊による）
      style: small
      align: right
    - type: paragraph
      text: （注１）せこい：ずるい
      style: small
    - type: paragraph
      text: （注２）｜感興《かんきょう》をそぐ：何かについて持っている興味をなくさせる
      style: small
