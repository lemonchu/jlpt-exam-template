# 阅读题库：原始手写便笺自身已有边框，直接使用原图，不增加外框。
schema_version: 1
section: R
groups:
- id: R8
  kind: reading
  title: 問題８
  instruction: 次の（１）から（４）の文章を読んで、後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。
  items:
  - id: R8-1
    label: （１）
    source_pages:
    - 1
    stimulus:
    - type: paragraph
      text: 教師＝話す人、生徒＝聞く人という構造が知らず知らずのうちに教室空間にできあがり、そして固定化してしまうのは恐ろしいことではないかと思う。教師が先取りしてしまうことで、生徒が自分自身で考え、解決しようとする芽をつみとってしまう場合がある。
    - type: paragraph
      text: いつも話し続けるのがコミュニケーションでない。教師側が沈黙し、「待つ」という行為も時には大切であろう。もう少し話したい、と思うところで{{注|一歩ひいてみる}}ことで、相手が言おうとすることを引き出すことができるのである。
    - type: paragraph
      text: （徳井厚子『日本語教師の「衣」再考―多文化共生への課題』くろしお出版による）
      style: small
      align: right
    - type: paragraph
      text: （注）一歩ひいてみる：ここでは、話すのをやめてみる
      style: small
    questions:
    - id: R-q46
      source_number: 46
      source_pages:
      - 1
      prompt: 筆者の考えに合うのはどれか。
      options:
      - 教師と生徒が自由に発言し合うことも必要だ。
      - 教師は生徒の考えを想像するべきだ。
      - 教師は生徒の発言を待つことも必要だ。
      - 教師は生徒に沈黙の時間を与えないようにすべきだ。
  - id: R8-2
    label: （２）
    source_pages:
    - 2
    stimulus:
    - type: paragraph
      text: 以下は、ある市役所のホームページに掲載されたお知らせである。
    - type: box
      blocks:
      - type: paragraph
        text: ２０１６年１１月１日
        align: right
        style: bold
      - type: paragraph
        text: スポーツ課
        align: right
        style: bold
      - type: heading
        text: 市民運動場の予約について
      - type: paragraph
        text: 市民運動場の予約は、これまで管理事務所窓口で受け付けておりましたが、２０１７年２月１日よりインターネット上の予約システムでも行うことができるようになります。予約システムの利用は平日、土日祝日を問わず２４時間可能で、予約は、窓口での予約と同様に、使用日の一か月前から受け付けます。
        style: bold
      - type: paragraph
        text: 予約システムの利用に際しては、事前に利用者登録が必要となりますので、身分を証明できるものを持って管理事務所窓口にお越しください。
        style: bold
      - type: paragraph
        text: 市民運動場管理事務所　〒００２‐３８３３　南松市中央町３‐２　中央公園内
        style: bold
      - type: paragraph
        text: （受付時間：月曜日～金曜日　９:００～１７:００）
        style: bold
        align: right
    questions:
    - id: R-q47
      source_number: 47
      source_pages:
      - 2
      prompt: 市民運動場の予約について、このお知らせは何を知らせているか。
      options:
      - 管理事務所窓口での予約受付期間が変更になること
      - 管理事務所窓口で利用者登録をすれば、インターネット上で予約ができるようになること
      - インターネット上での予約受付時間がこれまでより長くなること
      - インターネット上の予約システムの導入により、管理事務所窓口での予約ができなくなること
  - id: R8-3
    label: （３）
    source_pages:
    - 3
    stimulus:
    - type: paragraph
      text: 異文化間での対話を議論するときに，必ずといってよいくらい出てくるのが，価値観の理解と共有である。他者と対話を通して，人間関係を樹立していくには，自己の価値観を保存したままで，他者の価値観を理解するという方略だけでは十分ではない。相互的な働きかけを通じて，何か新たな価値を共有することが要求されるのである。すなわち，自らの価値観を相対化し，新たな価値を対話という共同作業を通して創り上げ，それを共有していく態度が必要なのだ。
    - type: paragraph
      text: （ARCLE 編集委員会・田中茂範・アレン玉井光江・根岸雅史・吉田研作編著『幼児から成人まで一貫した英語教育のための枠組み―ECF―English Curriculum Framework』リーベル出版による）
      style: small
      align: right
    questions:
    - id: R-q48
      source_number: 48
      source_pages:
      - 3
      prompt: 筆者によると、異文化間で対話を通して人間関係を築く上で最も大切なことは何か。
      options:
      - 自己の価値観を理解してもらおうとする態度
      - 自己の価値観を保ちながら、他者の価値観を理解する態度
      - 他者と自己の共通の価値観を創り上げていく態度
      - 他者の価値観の中に自己の価値観との共通点を見つける態度
  - id: R8-4
    label: （４）
    source_pages:
    - 4
    stimulus:
    - type: paragraph
      text: 以下は、劇を作ることを仕事にしている人が書いた文章である。
    - type: box
      blocks:
      - type: vertical
        text: '僕は「変な人」です。そうでなければ、こんな仕事はしてません。そして僕は「普通の人」です。だからこそこの仕事が成立しています。

          「特別なもの」を生み出そうとするとき、それがどんなふうに特別なのかを「普通」という視点から見極める必要があります。「特別」と「普通」、定規を何度も持ち替えるのです。そのために自分の中の普通さを死守するのです。'
      - type: paragraph
        text: （小林賢太郎『僕がコントや演劇のために考えていること』幻冬舎による）
        style: small
        align: right
    questions:
    - id: R-q49
      source_number: 49
      source_pages:
      - 4
      prompt: この文章で筆者が述べていることは何か。
      options:
      - 「普通」という視点がないと、「特別なもの」は作れない。
      - 「普通の人」が普通のものを作ると、「特別なもの」になる。
      - 「変な人」が普通のものを作ると、「特別なもの」になる。
      - 「変な人」の視点でしか、「特別なもの」は作れない。
- id: R9
  kind: reading
  title: 問題９
  instruction: 次の（１）から（３）の文章を読んで、後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。
  items:
  - id: R9-1
    label: （１）
    source_pages:
    - 5
    - 6
    stimulus:
    - type: paragraph
      text: 人に従順な飼い犬は、もともとオオカミの仲間を飼い｜馴《な》らしたものである。（中略）
    - type: paragraph
      text: ところが、「人間がオオカミを飼い｜馴《な》らした」という話には__謎が多い__。犬が人間と暮らすようになったのは、１５０００年ほど前の旧石器時代のことであると推測されている。当時の人類にとって、｜肉食獣《にくしょくじゅう》は恐るべき敵であった。そんな恐ろしい｜肉食獣《にくしょくじゅう》を飼い｜馴《な》らすという発想を当時の人類が持ち得たのだろうか。しかも犬を飼うということは、犬にエサをやらなければならない。わずかな食糧で暮らしていた人類に、犬を飼うほどの余裕があったのだろうか。また当時の人類は犬がいなくても、狩りをすることができた。犬を必要とする理由はなかったのである。
    - type: paragraph
      text: 最近の研究では、人間が犬を必要としたのではなく、犬の方から人間を求めて寄り添ってきたと考えられている。犬の祖先となったとされる弱いオオカミたちは、群れの中での順位が低く、食べ物も十分ではない。そこで、人間に近づき、食べ残しをあさるようになったのではないかと考えられているのである。
    - type: paragraph
      text: 弱いオオカミだけでは、狩りをすることができないが、人間の手助けをすることはできる。そして、やがて人間と犬とが共に狩りをするようになったと推察されている。こう考えると、当時、自然界の中で強い存在となりつつあった人間に寄り添うことは、犬にとって得なことが多かった。つまり、人間が犬を利用したのではなく、犬が人間を利用したかもしれないのである。
    - type: paragraph
      text: （稲垣栄洋『弱者の戦略』新潮社による）
      style: small
      align: right
    questions:
    - id: R-q50
      source_number: 50
      source_pages:
      - 5
      prompt: __謎が多い__とあるが、謎に合うのはどれか。
      options:
      - 犬ではなくオオカミを飼おうとしたこと
      - オオカミを｜肉食獣《にくしょくじゅう》だと思わなかったこと
      - 恐ろしいオオカミを飼って利用しようと考えたこと
      - 狩りの邪魔になるのに恐ろしいオオカミを飼おうとしたこと
    - id: R-q51
      source_number: 51
      source_pages:
      - 6
      prompt: 筆者によると、どのようなオオカミが犬の祖先だと考えられるか。
      options:
      - 人間から頼りにされたオオカミ
      - 狩りの上手なオオカミ
      - 群れから追い出されたオオカミ
      - 群れの中で下位のオオカミ
    - id: R-q52
      source_number: 52
      source_pages:
      - 6
      prompt: 犬の祖先が人間と暮らすようになったきっかけについて、筆者はどのように考えているか。
      options:
      - 人間を利用して仲間からの危険を避けようとした。
      - 人間に近づいて食糧を得ようとした。
      - 人間が狩りの手助けをさせた。
      - 人間がエサを与えた。
  - id: R9-2
    label: （２）
    source_pages:
    - 7
    - 8
    stimulus:
    - type: paragraph
      text: 子どもはこれから自分は大人になっていくのだから、自分はどうなるのだろうとそれは一所懸命に大人を観察している。その大人に魅力を感じれば、あんなふうになりたいと思うかもしれない。ほんのちょっとチャーミングなところを認めて、ああ失敗しても、{{注１|どじ}}ばかりでもいいんだと思えることもあるかもしれない。あるいは、僕はあんな大人にはならないだろうけれど、あんなふうにするのもすてきだなと感じることもあるに違いない。とにかく子どもは、①__そんなふうに__常に大人を見ているのである。
    - type: paragraph
      text: （中略）
    - type: paragraph
      text: 子どもはやがて大人になる。その大人に魅力がなかったら、それは自分に明日がないと言われているのと同じことだ。大人になってもつまらなそうだ、楽しいことがなさそうだと感じたら、君の未来はこの程度のものだとつきつけられているのと変わらない。②__これほど子どもにとって不幸なことはない__。
    - type: paragraph
      text: 大人はいつも子どもに見つめられている、子どもが自分を観察しているということを自覚していなければいけないと思う。わが身をつくろって、いいかっこするのではない。正直に失敗するのなら、子どもより上手に失敗してみせよう、傷つくなら子どもより上手に傷ついてみせよう。人生の先輩としてというより、現役の子どもに対してベテランの子どもとして、ベテランらしいところを見せてやろうじゃないか。そういう{{注２|｜気概《きがい》の}}大人がたくさんいれば、子どもたちはきっと大人の世界に魅力を見いだすに違いない。それが幸福な子どもの将来につながるのだと思う。
    - type: paragraph
      text: （大林宣彦『父の失恋　娘の結婚―べそっかきの幸福そうな顔』フレーベル館による）
      style: small
      align: right
    - type: paragraph
      text: （注１）どじ：うっかりした失敗
      style: small
    - type: paragraph
      text: （注２）｜気概《きがい》の：ここでは、強い気持ちを持った
      style: small
    questions:
    - id: R-q53
      source_number: 53
      source_pages:
      - 7
      prompt: ①__そんなふうに__とあるが、子どもはどんなふうに大人を見ているのか。
      options:
      - 早く大人になりたいと思っている。
      - 大人の姿から魅力的な部分を探している。
      - 自分が失敗したときどうするか考えている。
      - あんな大人にはなりたくないと思っている。
    - id: R-q54
      source_number: 54
      source_pages:
      - 8
      prompt: ②__これほど子どもにとって不幸なことはない__とあるが、何が不幸なのか。
      options:
      - 大人を見ても未来の自分に希望が持てないこと
      - 大人を見てもすてきな大人になる自信が持てないこと
      - 大人を見ても今何をしておけばいいか分からないこと
      - 大人を見ても将来自分のしたいことが見つからないこと
    - id: R-q55
      source_number: 55
      source_pages:
      - 8
      prompt: 筆者が大人に対して伝えたいことは何か。
      options:
      - 人生の先輩らしく、いつもかっこいい大人でいよう。
      - ベテランの子どもとして、子どもを幸福な将来へ導いてあげよう。
      - 子どもたちに、大人の魅力的な世界を教えよう。
      - 子どもたちに、ベテランの子どもとしての行いを示そう。
  - id: R9-3
    label: （３）
    source_pages:
    - 9
    - 10
    stimulus:
    - type: paragraph
      text: 科学記者を始めた２０年ほど前、記者の訪問を歓迎しない科学者は、けっして珍しくなかった。「新聞記者との付き合いには何のメリットもなく、時間の無駄。記者と親しい科学者は、同僚からうさんくさい目で見られる。真理の探究に没頭する科学者が、記者なんていう世俗を相手にしては{{注１|｜沽券《こけん》にかかわる}}」というわけだ。それが今は、まったく違う。科学者も、研究に税金を使うからには自分の仕事を積極的に世間に説明するのが当然だとみなされ、大学や研究所はメディア戦略を練るまでになった。__変われば変わるものだ__。
    - type: paragraph
      text: （中略）
    - type: paragraph
      text: 科学者側の広報が巧みになればなるほど、科学ジャーナリズムは科学者集団のたんなる宣伝係で仕事をした気になってしまう恐れがある。
    - type: paragraph
      text: 「サイエンス」や英国の「ネイチャー」に載る科学者の論文を、どの新聞も毎週のように記事にして紹介している。その多くが、これらの論文誌の巧みな広報資料や研究者の記者発表をもとにしているのだが、これなどまさに、何を社会に伝えるかは自分で決めるというジャーナリズムの{{注２|｜要《かなめ》}}を、科学者集団側になかば預けてしまっているのではないか。
    - type: paragraph
      text: 自分でネタ探しをするよりも、このほうがたしかに効率的なのだ。
    - type: paragraph
      text: 米国の科学ジャーナリズムの教科書には、科学者たちはマスメディアを自分たちの広報機関のようにとらえるものだと書いてある。科学ジャーナリズムは、広報戦略に{{注３|｜長《た》けてきた}}科学者たちとどう付き合っていくべきか。その哲学と戦略を、こちら側も改めて{{注４|｜肝《きも》に｜銘《めい》じて}}おかなければならない時代になった。
    - type: paragraph
      text: （YOMIURI ONLINE ＜http://www.yomiuri.co.jp/column/science/20090513-OYT8T00319.htm＞２０１０年３月７日取得による）
      style: small
      align: right
    - type: paragraph
      text: （注１）｜沽券《こけん》にかかわる：体面を損ねる
      style: small
    - type: paragraph
      text: （注２）｜要《かなめ》：最も大切な部分
      style: small
    - type: paragraph
      text: （注３）｜長《た》けてきた：上手になってきた
      style: small
    - type: paragraph
      text: （注４）｜肝《きも》に｜銘《めい》じて：忘れないように心にしっかりととどめて
      style: small
    questions:
    - id: R-q56
      source_number: 56
      source_pages:
      - 10
      prompt: __変われば変わるものだ__とあるが、科学者はどのように変わったのか。
      options:
      - 以前は記者を世俗的だと見ていたが、現在はメディアを信頼するようになった。
      - 以前は記者と距離を置いていたが、現在は積極的にメディアとかかわるようになった。
      - 以前は同僚の目を気にしていたが、現在は記者の目をより気にするようになった。
      - 以前は自らメディア戦略を練っていたが、現在は記者の力を借りるようになった。
    - id: R-q57
      source_number: 57
      source_pages:
      - 10
      prompt: 科学者との関係で、今のジャーナリズムにはどのような問題があるか。
      options:
      - 科学者が望む論文を記事にしていない。
      - 科学者が十分満足できる広報をしていない。
      - 科学者から提供された情報をそのまま伝えている。
      - 科学者から提供された情報を十分理解せずに報じている。
    - id: R-q58
      source_number: 58
      source_pages:
      - 10
      prompt: この文章で筆者が最も言いたいことは何か。
      options:
      - 科学者は、科学ジャーナリズムの立場をもっと理解すべきである。
      - 科学者は、科学ジャーナリズムとの関係のあり方を改めて見直すべきである。
      - 科学ジャーナリズムは、報道内容の決定にあたって主体的であるべきだ。
      - 科学ジャーナリズムは、科学の価値を正しく認めてもらえるよう努めるべきだ。
- id: R10
  kind: reading
  title: 問題１０
  instruction: 次の文章を読んで、後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。
  items:
  - id: R10-1
    source_pages:
    - 11
    - 12
    stimulus:
    - type: paragraph
      text: 暮らしの中で身近な木といえば、街路樹と公園の樹木、そして住宅の庭の木あたりでしょうか。いずれも毎日目にはしているものの、あらためて意識することは少ないと思います。でも、例えばこれがすべて枯れてしまったとしたらどうでしょう。なんとも寂しく、無味乾燥な、あるいは何か病気を連想させるようなイメージのまちになってしまうのではないでしょうか。また、昨今は、維持管理の面などから街路樹を植えないまちなどもあるようですが、一見近代的、未来都市的なイメージもしますが、うるおいややすらぎのないまちのようにも見えます。このようにまちの樹木は、実はとても大きな役割を持っています。
    - type: paragraph
      text: では、この木々たちは、ただ植えるだけ、存在するだけでいいのでしょうか。そうではありません。そこに意味や意義がなければならないのです。わかりやすく言うと、街路樹の｜樹種《じゅしゅ》を何にするかというようなことです。{{注１|その土地の植生}}を踏まえ、その上に歴史性や未来性を重ね合わせる。季節の移ろいの中で、人々がその木をどのように眺めながら暮らしていくのか。そんな積み重ねの上にはじめて「ここにはこの木を植えよう」ということになる。①__それ__がその木がその場所に存在する意義です。
    - type: paragraph
      text: 住宅の庭木も同じです。単に自分の好みばかりでなく、その木が住宅街の小路をどのように演出するのか、まわりとの調和はどうなのか。そんなことを考えていくのがまちづくりの中の「木」です。昨今のガーデニングブームで、確かに個々の家の庭は立派になりました。花や木の種類もずいぶん増えて、ひと昔前には無かったような色や形も見られます。そして、ガーデニングをする人達の情報交流も盛んとなり、新たなコミュニティも生まれているようです。しかし、いま一つ自分の土地から外に広がっていない感じがします。道路や公園は地域にとっての共有の庭であり、個々の部分と共有の部分が美しくなってこそはじめて全体が美しくなるのです。美しく楽しい庭を作っている人々には、②__もっと欲張って__美しく楽しいまちを作ってほしいと思います。
    - type: paragraph
      text: 「｜愛《め》でる」という言葉があります。これは主に植物に対して使われます。満開の桜や初夏の新緑、真夏の木陰や秋の紅葉・・・。私たちは{{注２|折々に}}木々を眺め、そこに日々の暮らしを重ね合わせたり、育ちゆく木々に子供達の明るい未来を願ったりしているのではないでしょうか。そしてそんな思いをこめて水やりや手入れをする。これが「｜愛《め》でる」ということだと思うのです。その｜愛《め》でる心と｜愛《め》でられる木々があってはじめてよいまちとなるのです。
    - type: paragraph
      text: （加藤美浩『まちづくりのススメ』による）
      style: small
      align: right
    - type: paragraph
      text: （注１）その土地の植生：その土地にどのような植物が生えているか
      style: small
    - type: paragraph
      text: （注２）折々に：ここでは、機会があるごとに
      style: small
    questions:
    - id: R-q59
      source_number: 59
      source_pages:
      - 12
      prompt: 筆者によると、まちの樹木の大きな役割とは何か。
      options:
      - 人々に木が身近な存在であることを意識させる。
      - 人々に未来都市的なイメージを与える。
      - 人々を現実の煩わしさから逃れさせる。
      - 人々を落ち着いた気持ちにさせる。
    - id: R-q60
      source_number: 60
      source_pages:
      - 12
      prompt: ①__それ__とはどういうことか。
      options:
      - その土地に暮らす人々の好みに合わせた樹木を植えること
      - その土地の特性と人々の暮らしを考慮し、樹木を植えること
      - その土地の歴史的な樹木を大切にし、保存すること
      - その土地の季節の移ろいを感じさせる樹木を大切にすること
    - id: R-q61
      source_number: 61
      source_pages:
      - 12
      prompt: ②__もっと欲張って__とあるが、筆者の気持ちと合うものはどれか。
      options:
      - 自分の好みだけではなく、まち全体との調和も考えてほしい。
      - ガーデニングをする人達同士で、もっと情報交換をしてほしい。
      - 個々の庭の花や木が、さらに美しく育つようにしてほしい。
      - 個々の庭よりも、まちの共有の部分のほうに力を入れてほしい。
    - id: R-q62
      source_number: 62
      source_pages:
      - 12
      prompt: 筆者の考えに合うのはどれか。
      options:
      - 人々がまちの木々を｜愛《め》でることで、子供達が自然に関心を持つようになる。
      - 人々がまちの木々を｜愛《め》でることが、よいまちづくりにつながる。
      - 人々がまちの木々の手入れを怠らなければ、よいまちになる。
      - 人々が季節による木々の変化に関心を持つことで、｜愛《め》でる心が生まれる。
- id: R11
  kind: reading
  title: 問題１１
  instruction: 次のＡとＢの文章を読んで、後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。
  items:
  - id: R11-ab
    source_pages:
    - 13
    - 14
    stimulus:
    - type: heading
      text: Ａ
    - type: box
      blocks:
      - type: paragraph
        text: 雑談はいろいろな意見を交換し合うことによって、ヒントを得ようというスケールの大きな場である。そこにいる誰もが自由に発言する権利を持っている。仮に自分とは反対意見であっても、まずは聞くという姿勢を保つこと、心理学のカウンセリングと同じである。
      - type: paragraph
        text: そして相手の発言に対して、自分の意見を軽い気分で述べる、それが雑談である。
      - type: paragraph
        text: どんなに間違っている、バカバカしいと思われる意見であっても、いったんそれを受け入れること。「なぜあの人はこのような発言をするのか」と考えていくと、自分がそれまで見落としていたことがあることに気がつくこともある。
      - type: paragraph
        text: 「話し上手は聞き上手」という言葉があるように、雑談では「いかに発言するか」よりも「いかに聞くか」が大切になる。
      - type: paragraph
        text: （多湖輝『人の心をつかむ「雑談力」情報が集まる「雑談力」』新講社による）
        style: small
        align: right
    - type: separator
    - type: heading
      text: Ｂ
    - type: box
      blocks:
      - type: paragraph
        text: 雑談は無駄だという人がいるが、本当にそうだろうか。辞書を調べると「無駄話」という意味もあるが、「さまざまなことを気楽に話し合うこと」という意味もある。気楽な気持ちのとき、人は本音を話すものだ。バカらしいと思う話もあるかもしれないが、雑談の中から相手の人間性が見えてくる。
      - type: paragraph
        text: そうはいっても、気楽に話せる雰囲気を作るのは簡単なことではない。まずは、自分から話のきっかけになりそうな小さなエピソードを話そう。相手が{{注|話に乗ってきた}}と思ったら、そこで自分の本音を話してみよう。そうすれば、相手もやがて心を開いて話し始めるだろう。そうなれば、雑談も意味のある時間となる。
    - type: paragraph
      text: （注）話に乗る：ここでは、話に興味を持つ
      style: small
    questions:
    - id: R-q63
      source_number: 63
      prompt: 雑談の良い点について、ＡとＢはどのように述べているか。
      options:
      - Ａはお互いの考えを認め合えると述べ、Ｂは相手の人間性が見えてくると述べている。
      - Ａは相手と意見交換ができると述べ、Ｂはバカらしい話をしても受け入れてもらえると述べている。
      - Ａは自分が気づいていなかったことに気づけると述べ、Ｂは相手の本音を知ることができると述べている。
      - Ａは誰もが自由に意見を発言できると述べ、Ｂは相手と自分との共通点を見つけることができると述べている。
      source_pages:
      - 14
    - id: R-q64
      source_number: 64
      prompt: 雑談をするときの姿勢について、ＡとＢはどのように述べているか。
      options:
      - ＡもＢも、相手の話をよく聞くことが大切だと述べている。
      - ＡもＢも、相手と自分が同じぐらいの割合で話すようにしようと述べている。
      - Ａは相手の話を聞くことが大切だと述べ、Ｂは自分から話すようにしようと述べている。
      - Ａは相手の発言の意図を考えることが大切だと述べ、Ｂはまずは相手に話をさせることが大切だと述べている。
      source_pages:
      - 14
- id: R12
  kind: reading
  title: 問題１２
  instruction: 次の文章を読んで、後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。
  items:
  - id: R12-architecture
    source_pages:
    - 15
    - 16
    - 17
    stimulus:
    - type: paragraph
      text: 建築の設計をやっていると様々な職人に出会う。大小を問わずどの現場でも一人や二人、{{注１|主役を張れる}}人がいる。__そうした人に出会うのが、現場に通う楽しみのひとつだ__。長い時間、図面にばかり接していると、現実を離れて思考が一人歩きすることがよくある。そんな時、彼らからもらう情報が{{注２|かけがえのない}}ものであることが分かる。我々が作り出す図面は、線で描かれた抽象的な記号に過ぎない。彼らは物に触っている。経験則によって裏付けられた、物に近い、深くて確かな情報を持っている。
    - type: paragraph
      text: 図面は人間の頭の中だけで作り出されたものだ。それを現実の建物に移し替えるには、木や鉄やコンクリートといった、物から手によって直接に得られる情報が不可欠だ。頭で生み出されたものは、思いこみや錯誤によって間違うことが多いからだ。
    - type: paragraph
      text: 今はコンピューターと情報通信の時代だ。それにともなって、手を動かす機会がどんどん少なくなってきている。建築の設計でもCAD（コンピューター利用設計）化の勢いはすさまじい。しかし、その図面は、設計の全体を把握しにくい。きれい過ぎて、何であれ、すべてうまくいっているように見えてしまう。手を経ずに、頭の中だけで作業が完結してしまっているからだろう。
    - type: paragraph
      text: '{{注３|トレーシングペーパー}}に鉛筆で苦労をして描かれた{{注４|旧来の}}図面は、そこに描く人の感情が入っている。うまくいっていないところは消しゴムで消し、描き直して修正していく。技術的に問題のあるところ、デザイン的にうまくいっていないところほど、線はにじみ、トレーシングペーパーは人の手の脂で汚れてくる。何回も描き直した個所は、しまいには擦り切れて穴が開いてしまうこともある。'
    - type: paragraph
      text: 描いた当人の自信がなければ、鉛筆の線にもその迷いを見て取ることもできる。慣れてくると、図面上の線から、描いた人の経験的なレベルや人柄さえ分かるようになる。手書きの図面には、すてがたい様々な種類の情報が塗り込められている。均質な図面の向こう側に人の姿が見えにくい分、CADでは大きなリスクを見落とす可能性もある。
    - type: paragraph
      text: 手から遠いコンピューターの出現によって、リスクの所在をかぎ取ることが、旧来の経験則では難しくなってきている。これは設計に限ったことではないだろう。今や情報通信とコンピューターはあらゆる分野に浸透し、社会全体を変えつつある。頭から生み出されたものが暴走している。リスクの所在が、より巨大で、見えにくくなった。
    - type: paragraph
      text: どこかでそれを、生身の身体を持つ人間の側に引き戻す必要がある。手から得られる情報は、効率は悪いが、現実の世界を{{注５|まさぐって}}得られるものだ。その人の身体だけにとどまる固有の情報といってもよい。忘れられつつある手の行き場を考えるべきだろう。
    - type: paragraph
      text: （内藤廣『建築のはじまりに向かって』王国社による）
      style: small
      align: right
    - type: paragraph
      text: （注１）主役を張る：ここでは、主要な役割を果たす
      style: small
    - type: paragraph
      text: （注２）かけがえのない：他に代わりがないほど貴重な
      style: small
    - type: paragraph
      text: （注３）トレーシングペーパー：ここでは、設計図を描くための紙
      style: small
    - type: paragraph
      text: （注４）旧来の：昔からの
      style: small
    - type: paragraph
      text: （注５）まさぐる：手探りをする
      style: small
    questions:
    - id: R-q65
      source_number: 65
      prompt: __そうした人に出会うのが、現場に通う楽しみのひとつだ__とあるが、なぜか。
      options:
      - 職人から得る情報で自分のやり方の正しさが確かめられるから
      - 職人たちの経験に基づいた信頼できる情報が得られるから
      - 様々な職人たちから建築設計の多様性が学べるから
      - 経験豊かな職人たちの仕事ぶりが見られるから
      source_pages:
      - 16
    - id: R-q66
      source_number: 66
      prompt: 鉛筆で描かれた図面について、筆者はどのように述べているか。
      options:
      - 設計の過程や描いた人に関する情報が得られる。
      - 経験を積んで設計に自信のある人にしか描けない。
      - 細部は分かりにくいが、全体は把握しやすい。
      - 情報を読み取りにくいが、描いた人の感情がこもっている。
      source_pages:
      - 16
    - id: R-q67
      source_number: 67
      prompt: 筆者は、コンピューターが社会にどのような影響を与えたと述べているか。
      options:
      - 多くの情報の中から必要な情報を選び出しにくくなった。
      - リスクの高い様々な種類の情報が｜氾濫《はんらん》するようになった。
      - これまでに得られた経験則が社会で必要とされなくなった。
      - どこにどのようなリスクが潜んでいるか把握しにくくなった。
      source_pages:
      - 16
    - id: R-q68
      source_number: 68
      prompt: この文章で筆者が最も言いたいことは何か。
      options:
      - コンピューター化によるリスクを経験則によって回避すべきだ。
      - コンピューター化による効率重視の風潮を改めるべきだ。
      - 手によってなされる仕事の伝統を守っていくべきだ。
      - 手によってなされる仕事の価値を再認識すべきだ。
      source_pages:
      - 17
- id: R13
  kind: reading
  title: 問題１３
  instruction: 右のページは、大森大学の図書館のホームページに書かれたサービスの案内である。下の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。
  items:
  - id: R13-library
    source_pages:
    - 19
    - 20
    stimulus:
    - type: box
      blocks:
      - type: heading
        text: 大森大学図書館
      - type: heading
        text: 他大学の図書館の資料の利用について
      - type: paragraph
        text: 利用したい資料が本学にない場合、他大学の図書館の資料を利用できます。
      - type: heading
        text: ① 他大学の図書館に行く
      - type: heading
        text: ①－Ａ 相互利用協定校を利用する
      - type: paragraph
        text: 相互利用協定に加盟している図書館は、学生証の提示のみで、利用することができます。図書館によって、受けられるサービスが異なりますので、下記一覧を参照してください。
      - type: paragraph
        text: 協定に加盟している図書館の一覧
        align: center
      - type: table
        rows:
        - - ''
          - 閲覧
          - 貸出
        - - みはま大学図書館
          - 可
          - 可
        - - 長島大学図書館
          - 可
          - 可
        - - あおば大学図書館
          - 可
          - 不可
        - - 中山工業大学図書館
          - 可
          - 不可
        header_rows: 1
      - type: heading
        text: ①－Ｂ 相互利用協定校以外を利用する
      - type: paragraph
        text: 本学図書館が発行する紹介状を持参すれば、相互利用協定校以外の図書館にも入館できます。受けられるサービスについては、各図書館に問い合わせてください。
      - type: paragraph
        text: 紹介状の発行は、所定の申込書に記入し本学図書館受付で申し込んでください。
      - type: paragraph
        text: '**注意：**利用時は、必ず学生証と紹介状を持参してください。

          紹介状の発行は無料ですが、発行まで約５日かかります。'
      - type: heading
        text: ② 他大学の図書館に複写を依頼し、取り寄せる
      - type: paragraph
        text: '本学図書館が他大学の図書館に複写を依頼し、取り寄せることができます。

          申し込みは、本学図書館受付、または本学図書館ホームページ上で行ってください。'
      - type: paragraph
        text: '**注意：**資料の複写料金、送料などは全額利用者負担となります。

          一度に依頼できる件数は５件までです。'
      - type: heading
        text: ③ 他大学の図書館から借用した資料を見る
      - type: paragraph
        text: '本学図書館が他大学の図書館から資料を一定の期間借用し、その資料を本学図書館内にて閲覧することができます。

          申し込みは、本学図書館受付で行ってください。'
      - type: paragraph
        text: '**注意：**資料の往復送料などは全額利用者負担となります。

          本学図書館内での閲覧に限ります。貸出はできません。

          借用可能な資料は、一人一点限りとなります。'
    questions:
    - id: R-q69
      source_number: 69
      prompt: 大森大学の学生のリンさんは、明日中に借りたい本がある。明日行ける図書館の中では、以下の４館が所蔵していることがわかったので、メモをした。リンさんが本を借りられるのは、次の方法のうちどれか。
      options:
      - 学生証を持参して、長島大学図書館に行く。
      - 今から紹介状を申請し、それを持参して、あおば大学図書館に行く。
      - 学生証を持参して、中山工業大学図書館に行く。
      - 今から紹介状を申請し、それを持参して、さくら大学図書館に行く。
      source_pages:
      - 19
      stimulus:
      - type: paragraph
        text: リンさんのメモ
      - type: image
        asset: assets/R-p19-Im2-mask.pdf
        alt: リンさんの手書きメモ。協定加盟：長島大学図書館 あり／あおば大学図書館 あり／中山工業大学図書館 あり／さくら大学図書館 なし。
    - id: R-q70
      source_number: 70
      prompt: 大森大学の学生のロイさんは利用したい資料があるが、大森大学にはなかった。他大学に行く時間がないため、複写依頼か資料借用のサービスを利用しようと考えている。ロイさんが注意しなければならないこととして合っているのは、次のどれか。
      options:
      - 複写依頼は、資料を所蔵する大学のホームページから行わなければならない。
      - 複写依頼は、一度に２件以上まとめて申し込むことはできない。
      - 資料の借用に必要な送料は、半額を自身が負担しなければならない。
      - 借用した資料は、大森大学図書館内で閲覧しなければならない。
      source_pages:
      - 19
