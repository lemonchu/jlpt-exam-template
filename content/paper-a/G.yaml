schema_version: 1
section: G
groups:
  - id: G5
    kind: choice
    title: 問題５
    instruction: 次の文の（　　　）に入れるのに最もよいものを、１・２・３・４から一つ選びなさい。
    items:
      - id: G26
        source_number: 26
        source_pages: [1]
        prompt: 朝の満員電車。車内の混雑を（　　　）、私の目の前に座っている学生風の男は、平然とノートパソコンを広げて、作業に没頭していた。
        options: [含めて, もとに, 除いて, よそに]
      - id: G27
        source_number: 27
        source_pages: [1]
        prompt: 私の父は、（　　　）もしないで漫画を批判するから、本当に嫌になる。
        options: [読まない, 読み, 読もう, 読んで]
      - id: G28
        source_number: 28
        source_pages: [1]
        prompt: |-
          （卒業生へのインタビューで）
          聞き手「学生時代にやったことで、今の仕事に役立っていることは何でしょうか。」
          ｜田中《たなか》「ラグビー部での経験ですね。チームワークの大切さを痛感しました。（　　　）、それは去年企画チームのリーダーになって初めて気づいたことですが。」
        options: [要するに, あるいは, もっとも, ついては]
      - id: G29
        source_number: 29
        source_pages: [1]
        prompt: 村の郷土史をまとめるにあたり、今年９０歳になる元村長の｜東《ひがし》｜山《やま》さんにお話を伺った。村に初めて汽車が走ったときのことを鮮明に覚えて（　　　）、その記憶力に驚いた。
        options: [おいでになり, 差し上げ, まいり, 申し上げ]
      - id: G30
        source_number: 30
        source_pages: [1]
        prompt: |-
          （求人サイトの「よくある質問」で）
          Ｑ：インテリアに関する知識がないのですが、働けますか。
          Ａ：研修があるので大丈夫です。知識はある（　　　）が、それよりも人柄や仕事に取り組む姿勢を重視しています。
        options: [にすぎません, ことは否めません, に越したことはありません, といっても過言ではありません]
      - id: G31
        source_number: 31
        source_pages: [1]
        prompt: |-
          （お知らせで）
          水道管破裂による断水のため、８月１２日まで市民プールの営業を休止します。復旧状況（　　　）、営業再開が遅れる可能性がありますので、ご了承ください。
        options: [次第には, 次第に, 次第では, 次第]
      - id: G32
        source_number: 32
        source_pages: [2]
        prompt: クレジットカードの番号等、他人に（　　　）困る情報は、電子メールには書かないほうがいいそうだ。
        options: [知っていても, 知っていなくても, 知らなくては, 知られては]
      - id: G33
        source_number: 33
        source_pages: [2]
        prompt: 仕事は、決められた時間内に、いかに成果を上げるかが大切であり、単に時間をかけて（　　　）と私は思う。
        options: [がんばることだといってもおかしくない, がんばればいいというものではない, がんばることでしかない, がんばりようがない]
      - id: G34
        source_number: 34
        source_pages: [2]
        prompt: 現在、潜水調査船を用いた調査研究が進展中であり、いずれ近いうちに海底のより詳細な地質構造が明らかに（　　　）。
        options: [なるものと思われる, するという思いがある, なったかに思える, するだろうと思う]
      - id: G35
        source_number: 35
        source_pages: [2]
        prompt: |-
          ｜山下《やました》「あのう、｜西村《にしむら》先輩。私、今日でこのサークルを（　　　）。」
          ｜西村《にしむら》「ええ？辞める？急にどうして？」
        options: [辞めてしまわれたのでしょうか, 辞めてしまったのかと思って, 辞めさせたらどうでしょうか, 辞めさせてもらおうかと思って]
  - id: G6
    kind: word_order
    title: 問題６
    instruction: 次の文の__★__に入る最もよいものを、１・２・３・４から一つ選びなさい。
    items:
      - id: G6-example
        is_example: true
        label: （問題例）
        source_pages: [3]
        prompt: あそこで __　　　__ __　　　__ __★__ __　　　__ は｜山田《やまだ》さんです。
        options: [テレビ, 見ている, を, 人]
        stimulus_position: after_options
        stimulus:
          - type: heading
            text: （解答のしかた）
          - type: paragraph
            style: bold
            text: １．正しい文はこうです。
          - type: box
            blocks:
              - type: table
                header_rows: 0
                borders: false
                rows:
                  - [あそこで, __　　　__, __　　　__, __★__, __　　　__, は｜山田《やまだ》さんです。]
                  - ['', １　テレビ, ３　を, ２　見ている, ４　人, '']
          - type: paragraph
            style: bold
            text: ２．__★__に入る番号を解答用紙にマークします。
          - type: paragraph
            text: （解答用紙）
          - type: table
            header_rows: 0
            width: 135
            align: center
            column_widths: [0.35, 0.65]
            rows:
              - [（例）, ①　●　③　④]
      - id: G36
        source_number: 36
        source_pages: [3]
        prompt: 「アセビ」という、白い花を咲かせる樹木を漢字で「馬酔木」と書くのは、アセビには __★__ __　　　__ __　　　__ __　　　__ そうです。
        options: [由来する, 有毒成分があり, 状態になることに, 馬が食べると酔ったような]
      - id: G37
        source_number: 37
        source_pages: [3]
        prompt: 家族の時間を大切にする夫は、つい __　　　__ __　　　__ __★__ __　　　__ ありがたい存在です。
        options: [本当に大切なものは何なのか, 私に, 仕事に夢中になりすぎる, 気づかせてくれる]
      - id: G38
        source_number: 38
        source_pages: [4]
        prompt: Ｚ県知事の｜林《はやし》｜和夫《かずお》氏は、週刊誌で、脱税を行った __　　　__ __　　　__ __★__ __　　　__ 異なり、名誉を傷つけられたとして、発行元のＸ社を相手取り訴訟を起こした。
        options: [事実とは全く, 疑いがあるなどと, 報じられた, ことに対し]
      - id: G39
        source_number: 39
        source_pages: [4]
        prompt: Ｑ鉄道が１０年ぶりに運賃値上げに踏み切った。安全対策や原油の高騰で支出が増え、経営努力だけでは対応しきれないと判断 __　　　__ __　　　__ __★__ __　　　__。
        options: [という, の, ことだ, して]
      - id: G40
        source_number: 40
        source_pages: [4]
        prompt: 世の中にはさまざまな資格があふれているが、資格を取った __　　　__ __　　　__ __　　　__ __★__ 世間は甘くないらしい。
        options: [だけ, ほど, で, 希望の職につける]
  - id: G7
    kind: cloze
    title: 問題７
    instruction: 次の文章を読んで、文章全体の趣旨を踏まえて、〔41〕から〔45〕の中に入る最もよいものを、１・２・３・４から一つ選びなさい。
    items:
      - id: G7-article
        source_pages: [5, 6]
        stimulus:
          - type: paragraph
            text: 以下は、小説家が書いたエッセイである。
          - type: box
            blocks:
              - type: heading
                text: 十人十色
              - type: paragraph
                text: マニュアルというものが、この世には存在する。機械を買った場合には、これを読む。書かれてある通りに動かないと困る。ビデオの再生ボタンを押したのに、録画が始まってはたまらない。ところが、生き物はそうはいかない。あちらに通用したことが、〔41〕。
              - type: paragraph
                text: うちで、ねこを飼い始めた当座は、何も分からなかった。吐いたりすると、それだけでびっくりしてしまった。あわてて、ねこを飼っている人に電話した。一番にかけたところが留守だと、ますます、動揺する。結局、関西の知り合いにまでかけて、
              - type: paragraph
                text: 「心配ありませんよ。ねこは吐くものですよ」
              - type: paragraph
                text: という言葉をいただき、やっと安心。こんな具合だった。
              - type: paragraph
                text: さて、〔42〕時に、当然のことながら「ねこの飼い方」の本も読んだ。マニュアルである。なるほど――と思えることが書いてある。中でも納得したのが、〔43〕。
              - type: paragraph
                text: ――「動物にとって、用足ししている（注１）時は、最も無防備な状態（注２）です。襲われたら大ピンチ。その最中、人に近づかれることを、ねこはとても嫌います。飼い主は、離れるようにし、のびのびとした気分でさせてやりましょう」
              - type: paragraph
                text: これは｜頷《うなず》ける。そこで、ゆずが――うちのねこの名前はゆずという――そうする時は遠慮していた。
              - type: paragraph
                text: 〔44〕。朝、ねこトイレ（注３）の砂をかきまわし、汚れ物を取り始めると、「ご苦労」というように、ゆずがやって来る。そして、まだトイレに手を入れているのに、「どけどけ」というように中に入ってくる。そして、足を踏ん張り、行うのだ。これ見よがしに（注４）。
              - type: paragraph
                text: あの説得力のあるマニュアルは、一体全体、何だったのか。なるほど、生きている物には個性があると、あらためて〔45〕。
          - type: paragraph
            style: small
            align: right
            text: （北村薫『書かずにはいられない―北村薫のエッセイ』新潮社による）
          - type: paragraph
            style: small
            text: （注１）用足ししている：大便や小便をしている
          - type: paragraph
            style: small
            text: （注２）無防備な状態：危険に備えていない様子
          - type: paragraph
            style: small
            text: （注３）ねこトイレ：箱の底に砂などを敷いた、ねこ用のトイレ
          - type: paragraph
            style: small
            text: （注４）これ見よがしに：自慢げに見せつけるように
        questions:
          - id: G41
            source_number: 41
            source_pages: [6]
            prompt: ''
            options: [こちらにはいえないこともない, こちらにいえるとは限らない, こちらにもいえるとは思わなかった, こちらにはいえないと思うのか]
          - id: G42
            source_number: 42
            source_pages: [6]
            prompt: ''
            options: [そういう, する, あの, やろうという]
          - id: G43
            source_number: 43
            source_pages: [6]
            prompt: ''
            options: [トイレのことだ, トイレのことであるに違いない, トイレだからである, トイレだと聞いている]
          - id: G44
            source_number: 44
            source_pages: [6]
            prompt: ''
            options: [もっともである, 当然である, ところがである, 例えばである]
          - id: G45
            source_number: 45
            source_pages: [6]
            prompt: ''
            options: [認識させられたことがある, 認識させられたおかげだ, 認識させられる話があった, 認識させられる出来事だった]
