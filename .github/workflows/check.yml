name: Check source and build samples
on:
  push:
    branches: [dev, test]
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_project.py
      - run: python -m compileall -q engine tools build.py
  samples:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        paper: [paper-a, paper-b]
        booklet: [written, listening]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra
      - name: Compile with bundled subsets only
        run: python build.py --paper ${{ matrix.paper }} --booklet ${{ matrix.booklet }}
